services:
  typedb:
    image: ${TYPEDB_IMAGE:-typedb/typedb:3.11.5}
    ports:
      - "${TYPEDB_PORT:-0}:1729"
      # TypeDB HTTP API; the ORM's connect-time version gate probes /v1/version here.
      - "${TYPEDB_HTTP_PORT:-0}:8000"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1729' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - typedb_network

networks:
  typedb_network:
    driver: bridge
