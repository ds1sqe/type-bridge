site_name: TypeBridge
site_url: https://ds1sqe.github.io/type-bridge/
site_description: A modern, Pythonic ORM for TypeDB with an Attribute-based API
site_author: ds1sqe
repo_url: https://github.com/ds1sqe/type-bridge
repo_name: ds1sqe/type-bridge
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            signature_crossrefs: true
            separate_signature: true
            heading_level: 2
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - guide/index.md
    - Attributes: guide/attributes.md
    - Entities: guide/entities.md
    - Relations: guide/relations.md
    - Abstract Types: guide/abstract-types.md
    - Cardinality & Flags: guide/cardinality.md
    - CRUD Operations: guide/crud.md
    - Queries & Expressions: guide/queries.md
    - Immutable Typed Queries: guide/typed-queries.md
    - Schema Management: guide/schema.md
    - Split-YAML & Workspace V1: guide/split-yaml-v1.md
    - Migrations: guide/migrations.md
    - Code Generator: guide/generator.md
    - TOML Schema DSL: guide/toml.md
    - API DTOs: guide/dto.md
    - TypeScript Typed Surface: guide/typescript.md
    - Rust Client: guide/rust.md
    - Server Container: guide/server-container.md
    - Functions: guide/functions.md
    - Validation: guide/validation.md
    - Upgrading to 2.0: guide/upgrade-v2.md
    - V2 Deprecations: guide/v2-deprecations.md
    - Logging: guide/logging.md
  - API Reference: reference/
  - Development:
    - development/index.md
    - Development Setup: development/setup.md
    - Testing: development/testing.md
    - TypeDB Concepts: development/typedb.md
    - Abstract Types: development/abstract-types.md
    - Internals: development/internals.md
    - Generated Rust Parity: development/rust-generated-parity.md
    - Unified Typed Query Contract: development/typed-query-contract.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ds1sqe/type-bridge
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/type-bridge/
