site_name: TypeBridge
site_url: https://ds1sqe.github.io/type-bridge/
site_description: Typed Python, TypeScript, and Rust application tooling for TypeDB
site_author: ds1sqe
repo_url: https://github.com/ds1sqe/type-bridge
repo_name: ds1sqe/type-bridge
edit_uri: edit/master/docs/

exclude_docs: |
  SKILL.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            signature_crossrefs: true
            separate_signature: true
            heading_level: 2
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Python Quick Start: getting-started/quickstart.md
  - Guides:
    - guide/index.md
    - SDKs:
      - Choose an SDK: guide/sdks.md
      - Cargo Package Index: guide/cargo-packages.md
      - TypeScript / Node: guide/typescript.md
      - Rust: guide/rust.md
    - Model TypeDB Data:
      - Overview: guide/models.md
      - Attributes: guide/attributes.md
      - Entities: guide/entities.md
      - Relations: guide/relations.md
      - Abstract Types: guide/abstract-types.md
      - Cardinality & Flags: guide/cardinality.md
      - Validation: guide/validation.md
      - Application DTOs: guide/dto.md
    - Read and Write Data:
      - Overview: guide/data.md
      - CRUD & Transactions: guide/crud.md
      - Queries & Expressions: guide/queries.md
      - Immutable Typed Queries: guide/typed-queries.md
      - Functions: guide/functions.md
    - Schema Lifecycle:
      - Overview: guide/schema-workflows.md
      - Split-YAML & Workspace V1: guide/split-yaml-v1.md
      - Migrations: guide/migrations.md
      - Code Generator: guide/generator.md
      - Schema Commands: guide/schema.md
      - TOML Recovery: guide/toml.md
    - Operate and Upgrade:
      - Overview: guide/operations.md
      - Server Container: guide/server-container.md
      - Logging: guide/logging.md
      - Upgrading to 2.0: guide/upgrade-v2.md
      - V2 Deprecations: guide/v2-deprecations.md
  - Python API: reference/
  - Development:
    - development/index.md
    - Development Setup: development/setup.md
    - Testing: development/testing.md
    - Architecture:
      - Internals: development/internals.md
      - Rust Backend: development/rust-backend.md
      - TypeDB Concepts & Compatibility: development/typedb.md
      - Abstract Type Concepts: development/abstract-types.md
    - Maintainer Contracts:
      - Unified Typed Query Contract: development/typed-query-contract.md
      - Generated Rust Parity: development/rust-generated-parity.md
      - Integration Coverage Inventory: development/integration-coverage-inventory.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ds1sqe/type-bridge
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/type-bridge/
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@type-bridge/node
