services:
  typedb:
    image: ${TYPEDB_IMAGE:-typedb/typedb:3.12.1}
    ports:
      - "${TYPEDB_PORT:-0}:1729"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1729' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - proxy_net

  proxy:
    build:
      context: ./type-bridge-core
      dockerfile: Dockerfile.server
    depends_on:
      typedb:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-0}:8080"
    environment:
      TYPEDB_ADDRESS: "typedb:1729"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
