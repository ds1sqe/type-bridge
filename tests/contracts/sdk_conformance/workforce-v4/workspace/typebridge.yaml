format: typebridge.workspace/v1
schema:
  root: schema/schema.yaml
  ownership: exclusive
  managed-scope: workforce-v4
compatibility:
  semantic-profile: typedb-3.12.1/v1
migrations:
  directory: migrations/v2
  app-label: workforcev4
environments:
  live:
    database: workforce_v4
    uri: 127.0.0.1:1729
    migrate: "true"
    credential:
      username: env:TYPEBRIDGE_WORKFORCE_V4_USERNAME
      password: env:TYPEBRIDGE_WORKFORCE_V4_PASSWORD
