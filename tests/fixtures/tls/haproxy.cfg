global
    log stdout format raw local0
    maxconn 256
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend typedb_grpc_tls
    bind :1729 ssl crt /tmp/type-bridge-server.pem alpn h2
    default_backend typedb_grpc_plain

backend typedb_grpc_plain
    server typedb typedb:1729 check

frontend typedb_http_tls
    bind :8000 ssl crt /tmp/type-bridge-server.pem alpn http/1.1
    default_backend typedb_http_plain

backend typedb_http_plain
    server typedb typedb:8000 check
