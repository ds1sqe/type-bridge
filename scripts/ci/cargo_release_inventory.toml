schema-version = 1
release-version = "2.1.0"
first-party-msrv = "1.88"
candidate-toolchain = "1.94.1"
repository = "https://github.com/ds1sqe/type-bridge"

# This is the closed Cargo product inventory. Publication order is dependency
# order; immutable packages are verified in place and private bindings are
# classified here so they cannot silently enter a crates.io release.

[[packages]]
name = "type-bridge-contract"
manifest = "crates/contract/Cargo.toml"
classification = "public-first-party"
role = "supporting"
version-policy = "lockstep"
publish-order = 1
docs-target = "lib"

