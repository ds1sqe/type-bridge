name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_HOME: ${{ github.workspace }}/../.cargo-home
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_STABLE_TOOLCHAIN: "1.94.1"

jobs:
  # Rust crate: compile, test, lint (parallel with Python jobs)
  rust-check:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          components: clippy

      - name: Install pinned cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-about@0.9.1

      - name: Verify locked native dependency notice
        if: runner.os == 'Linux'
        run: python scripts/ci/generate_native_dependency_notice.py --check

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-v3-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: cargo check
        working-directory: type-bridge-core
        run: cargo check --all-targets

      - name: cargo test
        working-directory: type-bridge-core
        run: cargo test --all-targets

      - name: Check alternate serde_json backends
        working-directory: type-bridge-core
        run: cargo test -p type-bridge-contract --features serde-backend-conformance

      - name: Check released validation-rule wire without feature unification
        working-directory: type-bridge-core
        env:
          CARGO_TARGET_DIR: target/rule-wire-standalone
        run: >-
          cargo test --locked
          --manifest-path crates/core/tests/fixtures/rule-wire-standalone/Cargo.toml

      - name: Check generated Rust projection package
        working-directory: type-bridge-core
        run: cargo test -p type-bridge-schema-codegen --test rust_acceptance

      - name: Install generated Rust MSRV
        if: runner.os == 'Linux'
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check generated Rust projection on MSRV 1.88
        if: runner.os == 'Linux'
        working-directory: type-bridge-core
        run: >-
          cargo +1.88.0 test --locked
          -p type-bridge-schema-codegen --test rust_acceptance
          generated_rust_crate_compiles_rejects_invalid_types_and_runs -- --exact

      - name: cargo clippy
        working-directory: type-bridge-core
        run: cargo clippy --all-targets -- -D warnings

  # I6 single-feature offline legs: verify neither single-band feature combination rots.
  # These are compile-only checks (no live server, no tests) — cargo check only.
  band-feature-check:
    name: Band feature check (${{ matrix.band }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - band: band8
            features: band8,axum-transport
          - band: band9
            features: band9,axum-transport
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-band-v3-${{ matrix.band }}-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: cargo check (${{ matrix.band }})
        working-directory: type-bridge-core
        run: cargo check -p type-bridge-orm -p type-bridge-server --no-default-features --features ${{ matrix.features }}

  # Rust code coverage (informational, does not block CI)
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-nightly-v3-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: Generate LCOV report
        run: ./scripts/coverage.sh branch --lcov

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: type-bridge-core/target/llvm-cov/lcov.branch.info
          flags: rust
          fail_ci_if_error: false

  # Build maturin wheels for all platforms (parallel with other jobs)
  build-wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: wheels-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: wheels-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: wheels-macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: wheels-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: wheels-windows-x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (Linux aarch64 cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          # The manylinux aarch64 cross-compiler does not define the ARM ACLE
          # macro __ARM_ARCH that ring's pregenerated assembly requires. The
          # variable name is target-suffixed, so it only affects the aarch64
          # Linux wheel even though it is declared on every matrix leg.
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          rust-toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
          args: --release --out dist -i python3.13
          manylinux: auto
          working-directory: type-bridge-core

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: type-bridge-core/dist/*.whl

  # Node binding is a required CI gate: the #124 NAPI pillar was previously untested
  # in CI, so its native + TypeScript surface and database-free gates run here to keep
  # the #110 single-core / thin-bindings invariant from silently regressing.
  node-check:
    name: Node binding
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: type-bridge-core/crates/node
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-node-v3-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: type-bridge-core/crates/node/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build native module and TypeScript surface
        run: npm run build

      - name: Verify native module built
        run: ls type_bridge_node.*.node

      - name: Typecheck
        run: npm run typecheck

      - name: Compile generated projection integration harness
        run: npm run typecheck:projection-integration

      - name: Thin-binding scope probe
        run: npm run scope:probe

      - name: Check generated TypeScript projection package
        run: node ../schema-codegen/tests/typescript_acceptance/check.mjs

      - name: Unit tests
        run: npm run test:unit

      - name: DTS comparator tests
        run: npm run test:dts

      - name: DTS baseline parity
        run: npm run dts:parity

      - name: Package smoke
        run: npm run smoke:package

      - name: Contract foundation adapter
        run: npm run test:contract-adapter

  # Compile and execute a clean generated package against the exact wheel pair
  # on every supported Python line. The consumer extracts candidates outside
  # the checkout and rejects source leakage or handwritten root exports.
  python-generated-package-compat:
    name: Python ${{ matrix.python-version }} generated wheel compatibility
    runs-on: ubuntu-latest
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13.5", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_PREFERENCE: only-system
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Download Linux x86_64 core wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheels-linux-x86_64
          path: tmp/generated-python-wheels/core

      - name: Build root Python wheel
        run: >-
          uv build --wheel --package type-bridge
          --out-dir tmp/generated-python-wheels/root

      - name: Prepare generated package and consumer tools
        run: |
          scripts/ci/prepare_generated_live_fixture.sh python \
            tmp/generated-python-wheels/generated
          uv venv --python python tmp/generated-python-tools
          uv pip install --python tmp/generated-python-tools/bin/python \
            'pydantic>=2.12.4' 'isodate==0.7.2' 'jinja2>=3.1.0' \
            'typer>=0.15.0' 'pyright>=1.1.407'

      - name: Run isolated generated-package compatibility
        run: |
          mapfile -t core_wheels < <(
            find tmp/generated-python-wheels/core -maxdepth 1 -type f \
              -name 'type_bridge_core-*.whl' -print
          )
          mapfile -t root_wheels < <(
            find tmp/generated-python-wheels/root -maxdepth 1 -type f \
              -name 'type_bridge-*.whl' -print
          )
          if [[ ${#core_wheels[@]} -ne 1 || ${#root_wheels[@]} -ne 1 ]]; then
            printf 'Expected one root/core wheel pair; root=%s core=%s\n' \
              "${#root_wheels[@]}" "${#core_wheels[@]}" >&2
            exit 1
          fi
          python scripts/ci/run_generated_python_artifact.py \
            --root-wheel "${root_wheels[0]}" \
            --core-wheel "${core_wheels[0]}" \
            --generated-stage tmp/generated-python-wheels/generated \
            --python "$PWD/tmp/generated-python-tools/bin/python" \
            --pyright "$PWD/tmp/generated-python-tools/bin/pyright"
  # Code quality: linting and formatting (parallel)
  lint:
    name: Python ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [ruff-lint, ruff-format]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff lint check
        if: matrix.check == 'ruff-lint'
        run: uv run ruff check .

      - name: Run ruff format check
        if: matrix.check == 'ruff-format'
        run: uv run ruff format --check .

  # Type checking with pyright (parallel matrix for faster execution)
  typecheck:
    name: Python Type Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [type_bridge, examples, tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install pyright
        run: uv pip install pyright

      # The generated-projection acceptance check (tests target) shells out to
      # `maturin develop`; pin the same Maturin the artifact contract pins.
      - name: Install maturin
        if: matrix.target == 'tests'
        run: uv pip install maturin==1.14.1

      - name: Generate example Python package
        if: matrix.target == 'examples'
        run: uv run type-bridge --manifest examples/typebridge.yaml schema generate

      - name: Run pyright on ${{ matrix.target }}
        run: uv run pyright ${{ matrix.target }}/

      - name: Check intentional unified Query typing diagnostics
        if: matrix.target == 'tests'
        run: uv run python tests/contracts/typed_query/python/check_negative.py

      - name: Check intentional owner-aware typing diagnostics
        if: matrix.target == 'tests'
        run: uv run python tests/unit/typed_query/check_negative.py

      - name: Check intentional typed Query API diagnostics
        if: matrix.target == 'tests'
        run: uv run python tests/unit/typed_query/check_query_negative.py

      - name: Check generated Python projection package
        if: matrix.target == 'tests'
        run: uv run python type-bridge-core/crates/schema-codegen/tests/acceptance/check.py

  # Unit tests (fast, no external dependencies, parallel execution)
  test-unit:
    name: Python Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13.5", "3.14"]
    env:
      # The repo's .python-version pins 3.13 for local dev; without these,
      # uv ignores the matrix interpreter and downloads a managed build
      # whose missing shared libpython breaks the typedb native driver.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_PREFERENCE: only-system
      # PyO3 0.23 predates CPython 3.14, but this extension uses abi3-py312.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install pytest-xdist for parallel execution
        run: uv pip install pytest-xdist

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ -v --tb=short -n auto \
            --cov=type_bridge --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  # Integration tests (require TypeDB server, parallel by test category)
  test-integration:
    name: Python Integration (${{ matrix.test-group }}, ${{ matrix.typedb-server }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Every populated ordinary integration directory is represented here.
        # Generated CRUD and generation coverage now lives in the schema suite;
        # parity and proxy retain dedicated jobs because they need extra runtimes.
        test-group:
          [queries, schema, expressions, session]
        # Fan across the retained server lines: band 8 (3.11.5) and the
        # dual-band 3.12 line. The 3.12 leg prefers the
        # embedded band-9 driver after safe discovery, with band-8 retained as
        # the compatibility fallback. Keep in sync with compose default and
        # version SSOT in crates/core.
        typedb-server:
          - "typedb/typedb:3.11.5"
          - "typedb/typedb:3.12.1"
        include:
          - typedb-server: "typedb/typedb:3.11.5"
            python-driver: "3.11.5"
          # The 3.12 leg pairs the band-9 installed driver a 3.12 user has;
          # server 3.12 accepts it natively.
          - typedb-server: "typedb/typedb:3.12.1"
            python-driver: "3.12.1"

    # Start TypeDB as a service container (runs first, before steps)
    services:
      typedb:
        image: ${{ matrix.typedb-server }}
        ports:
          - 1729:1729
          # TypeDB HTTP API; the connect-time version gate probes /v1/version.
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install the band's Python driver
        run: uv pip install "typedb-driver==${{ matrix.python-driver }}"

      - name: Wait for TypeDB server to be ready
        run: |
          echo "Waiting for TypeDB server to start..."
          echo "Container ID: ${{ job.services.typedb.id }}"

          # Show initial logs for debugging
          echo "=== Initial TypeDB logs ==="
          docker logs ${{ job.services.typedb.id }} 2>&1 || echo "Could not fetch logs"
          echo "==========================="

          # Wait for server to be ready by checking port connectivity
          for i in {1..30}; do
            if nc -z localhost 1729 2>/dev/null; then
              echo "TypeDB server is ready on port 1729!"
              docker logs ${{ job.services.typedb.id }} 2>&1 | tail -20
              break
            fi
            echo "Waiting for port 1729... ($i/30)"
            sleep 2
          done

          # Final check
          if ! nc -z localhost 1729 2>/dev/null; then
            echo "ERROR: TypeDB server did not start within 60 seconds"
            echo "=== Full TypeDB logs ==="
            docker logs ${{ job.services.typedb.id }} 2>&1
            exit 1
          fi

      - name: Run integration tests for ${{ matrix.test-group }}
        env:
          USE_DOCKER: false
          TYPEDB_ADDRESS: localhost:1729
        run: uv run pytest tests/integration/${{ matrix.test-group }} -m integration -v --tb=short

  # Rust ORM live-TypeDB integration. The ordinary rust-check job deliberately
  # leaves `integration-tests` disabled so it remains an offline gate. This job
  # selects the non-ignored real-provider target explicitly. The 3.12 leg pins
  # Phase 0's current
  # provider baseline rather than inheriting an older patch from another job.
  rust-integration:
    name: Rust integration (${{ matrix.typedb-server }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        typedb-server:
          - "typedb/typedb:3.11.5"
          - "typedb/typedb:3.12.1"
        include:
          - typedb-server: "typedb/typedb:3.11.5"
            semantic-profile: "typedb-3.11.5/v1"
          - typedb-server: "typedb/typedb:3.12.1"
            semantic-profile: "typedb-3.12.1/v1"

    services:
      typedb:
        image: ${{ matrix.typedb-server }}
        ports:
          - 1729:1729
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Set up Python for shipped converter lifecycle
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install uv for shipped converter lifecycle
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-rust-integration-v1-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: Install the source-tree Python product
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: uv sync --no-dev

      - name: Wait for TypeDB server to be ready
        run: |
          for i in {1..30}; do
            if nc -z localhost 1729 2>/dev/null; then
              echo "TypeDB server is ready on port 1729"
              break
            fi
            echo "Waiting for port 1729... ($i/30)"
            sleep 2
          done
          if ! nc -z localhost 1729 2>/dev/null; then
            echo "ERROR: TypeDB server did not start within 60 seconds"
            docker logs ${{ job.services.typedb.id }} 2>&1 || true
            exit 1
          fi

      - name: Run Rust ORM integration suite
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
        run: >-
          cargo test --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-orm --features integration-tests
          --test integration -- --nocapture

      - name: Run production V1 + V2 server live smoke
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
        run: >-
          timeout --foreground 10m
          cargo test --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-server --features v2-query
          --test v2_query_integration_tests
          production_binary_serves_v1_health_and_authenticated_v2_query
          -- --ignored --exact --nocapture

      - name: Run generated Rust projection live smoke
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
          TYPE_BRIDGE_RUST_PROJECTION_INTG_DATABASE: type_bridge_rust_projection_live
          TYPE_BRIDGE_ACCEPTANCE_SEMANTIC_PROFILE: ${{ matrix.semantic-profile }}
        run: >-
          cargo test --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-schema-codegen --test rust_projection_live
          -- --ignored --nocapture

      - name: Run CLI empty-workspace replay lifecycle
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
        run: >-
          cargo test --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-cli --test e2e_workspace_live
          empty_workspace_to_replayed_history_live
          -- --ignored --exact --nocapture

      - name: Prove verify does not create databases
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
        run: >-
          cargo test --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-cli --test e2e_workspace_live
          verify_never_creates_databases_live
          -- --ignored --exact --nocapture

      - name: Run legacy adoption and evolution lifecycle
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
        run: >-
          cargo test --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-cli --test e2e_workspace_live
          adopt_legacy_history_then_evolve_live
          -- --ignored --exact --nocapture

      - name: Run shipped Python converter to native adoption lifecycle
        if: matrix.typedb-server == 'typedb/typedb:3.12.1'
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
          TYPE_BRIDGE_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: >-
          cargo test --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-cli --test e2e_workspace_live
          shipped_python_converter_to_native_adoption_live
          -- --ignored --exact --nocapture

  # Required, bounded TLS proof over one server per supported protocol band.
  # This intentionally runs only typedb-runtime's focused live target: the
  # broader plaintext, binding, CLI, and remote-envelope suites have separate
  # gates. Band 8 consumes the namespaced compatibility package; band 9
  # consumes the official upstream 3.12.1 driver against the current server.
  tls-transport-matrix:
    name: TLS transport (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: band8-packaging
            typedb-server: "typedb/typedb:3.11.5"
            server-version: "3.11.5"
            driver-band: "8"
            driver-version: "3.11.5"
          - lane: band9-upstream
            typedb-server: "typedb/typedb:3.12.1"
            server-version: "3.12.1"
            driver-band: "9"
            driver-version: "3.12.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-tls-v1-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: Start isolated TypeDB and TLS terminator
        env:
          TYPEDB_IMAGE: ${{ matrix.typedb-server }}
          TYPEDB_PORT: "0"
          TYPEDB_HTTP_PORT: "0"
          TYPEDB_TLS_PORT: "0"
          TYPEDB_TLS_HTTP_PORT: "0"
        run: >-
          docker compose -f docker-compose.yml -p type-bridge-tls-ci
          up -d typedb typedb-tls

      - name: Resolve and verify TLS endpoints
        env:
          EXPECTED_SERVER_VERSION: ${{ matrix.server-version }}
        run: |
          discover_port() {
            local container_port="$1"
            local published=""
            for attempt in {1..5}; do
              published="$(docker compose -f docker-compose.yml \
                -p type-bridge-tls-ci port typedb-tls "$container_port" || true)"
              if [[ -n "$published" ]]; then
                printf '%s' "$published" | tail -1 | sed 's/.*://'
                return 0
              fi
              sleep 1
            done
            return 1
          }
          tls_grpc_port="$(discover_port 1729)"
          tls_http_port="$(discover_port 8000)"
          if [[ -z "$tls_grpc_port" || -z "$tls_http_port" ]]; then
            echo "failed to resolve isolated TLS ports" >&2
            exit 1
          fi

          root_ca="$GITHUB_WORKSPACE/tests/fixtures/tls/root-ca.pem"
          version_body=""
          for attempt in {1..45}; do
            if timeout 3 openssl s_client \
                -connect "127.0.0.1:${tls_grpc_port}" \
                -servername localhost \
                -verify_hostname localhost \
                -verify_return_error \
                -CAfile "$root_ca" \
                -alpn h2 </dev/null >/dev/null 2>&1; then
              version_body="$(curl --fail --silent --max-time 3 \
                --cacert "$root_ca" \
                --resolve "localhost:${tls_http_port}:127.0.0.1" \
                "https://localhost:${tls_http_port}/v1/version" || true)"
              if [[ "$version_body" == *"\"version\":\"${EXPECTED_SERVER_VERSION}\""* ]]; then
                break
              fi
            fi
            if [[ "$attempt" == 45 ]]; then
              echo "TLS endpoints did not report TypeDB ${EXPECTED_SERVER_VERSION}" >&2
              echo "last version response: ${version_body}" >&2
              exit 1
            fi
            sleep 2
          done

          if curl --fail --silent --max-time 3 \
              "http://127.0.0.1:${tls_http_port}/v1/version" >/dev/null 2>&1; then
            echo "TLS-only HTTP endpoint unexpectedly accepted plaintext" >&2
            exit 1
          fi

          echo "TYPEDB_TLS_ADDRESS=127.0.0.1:${tls_grpc_port}" >> "$GITHUB_ENV"
          echo "TYPEDB_TLS_HTTP_PORT=${tls_http_port}" >> "$GITHUB_ENV"
          echo "TYPEDB_TLS_ROOT_CA=${root_ca}" >> "$GITHUB_ENV"

      # Fetch before scoping SSL_CERT_FILE to the fixture. The Rust native-root
      # loaders used by core and all three tonic drivers honor this standard
      # Unix trust-store override; Cargo remains offline while it is active.
      - name: Fetch the locked Rust graph
        run: cargo fetch --locked --manifest-path type-bridge-core/Cargo.toml

      - name: Run focused custom-root, fallback, and native-root proofs
        env:
          CARGO_NET_OFFLINE: "true"
          SSL_CERT_FILE: ${{ github.workspace }}/tests/fixtures/tls/root-ca.pem
          TYPE_BRIDGE_TLS_LIVE_REQUIRED: "1"
          TYPE_BRIDGE_TLS_NATIVE_ROOTS: "1"
          TYPE_BRIDGE_TLS_EXPECTED_SERVER_VERSION: ${{ matrix.server-version }}
          TYPE_BRIDGE_TLS_EXPECTED_DRIVER_BAND: ${{ matrix.driver-band }}
          TYPE_BRIDGE_TLS_EXPECTED_DRIVER_VERSION: ${{ matrix.driver-version }}
        run: >-
          cargo test --locked --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-typedb-runtime --test tls_live
          -- --nocapture --test-threads=1

      - name: Run generated Rust application over TLS
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/tests/fixtures/tls/root-ca.pem
          TYPE_BRIDGE_RUST_PROJECTION_TLS: "1"
          TYPE_BRIDGE_RUST_PROJECTION_INTG_DATABASE: type_bridge_rust_projection_tls
          TYPE_BRIDGE_ACCEPTANCE_SEMANTIC_PROFILE: typedb-${{ matrix.server-version }}/v1
          ACCEPTANCE_TARGET_DIR: ${{ github.workspace }}/type-bridge-core/target/tmp_projection_live_target
        run: |
          export TYPEDB_ADDRESS="$TYPEDB_TLS_ADDRESS"
          export TYPEDB_HTTP_PORT="$TYPEDB_TLS_HTTP_PORT"
          cargo test --locked --manifest-path type-bridge-core/Cargo.toml \
            -p type-bridge-schema-codegen --test rust_projection_live \
            generated_rust_projection_round_trips_exact_live_models \
            -- --ignored --exact --nocapture

      - name: Show TLS stack logs on failure
        if: failure()
        run: >-
          docker compose -f docker-compose.yml -p type-bridge-tls-ci
          logs --no-color typedb typedb-tls

      - name: Stop isolated TLS stack
        if: always()
        run: >-
          docker compose -f docker-compose.yml -p type-bridge-tls-ci
          down -v --remove-orphans

  # Preserve the established job identity while making its authority generated-only.
  # Binding-specific live jobs execute generated applications; this gate proves
  # every removed handwritten operation maps to those exact sources and that
  # all three emitters agree on the canonical projection.
  cross-language-parity:
    name: Generated cross-language parity inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-generated-parity-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Audit generated successors and removed-source mapping
        run: >-
          uv run pytest
          tests/unit/compat/test_generated_only_operation_parity_inventory.py
          tests/unit/compat/test_handwritten_operation_removal_map.py
          -q --tb=short

      - name: Check canonical Python, TypeScript, and Rust projection parity
        run: >-
          cargo test --locked --manifest-path type-bridge-core/Cargo.toml
          -p type-bridge-schema-codegen --test cross_binding
  # Node binding live-TypeDB integration. Source TypeScript is always compiled
  # before Node executes it, including the generated-package application suite.
  node-integration:
    name: Node integration (${{ matrix.typedb-server }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: type-bridge-core/crates/node
    strategy:
      matrix:
        typedb-server:
          - "typedb/typedb:3.11.5"
          - "typedb/typedb:3.12.1"
        include:
          - typedb-server: "typedb/typedb:3.11.5"
            typedb-version: "3.11.5"
            semantic-profile: "typedb-3.11.5/v1"
          - typedb-server: "typedb/typedb:3.12.1"
            typedb-version: "3.12.1"
            semantic-profile: "typedb-3.12.1/v1"

    services:
      typedb:
        image: ${{ matrix.typedb-server }}
        ports:
          - 1729:1729
          # TypeDB HTTP API; the connect-time version gate probes /v1/version.
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-node-v2-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: type-bridge-core/crates/node/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # Full build (native cdylib + tsc dist/): the integration tests require() the
      # package root, which resolves to dist/index.js, so build:native alone is not enough.
      - name: Build package
        run: npm run build

      - name: Export native artifact path
        run: echo "TYPE_BRIDGE_NODE_NATIVE_PATH=$(ls "$PWD"/type_bridge_node.*.node | head -1)" >> "$GITHUB_ENV"

      - name: Wait for TypeDB server to be ready
        run: |
          for i in {1..30}; do
            if nc -z localhost 1729 2>/dev/null; then
              echo "TypeDB server is ready on port 1729"
              break
            fi
            echo "Waiting for port 1729... ($i/30)"
            sleep 2
          done
          if ! nc -z localhost 1729 2>/dev/null; then
            echo "ERROR: TypeDB server did not start within 60 seconds"
            docker logs ${{ job.services.typedb.id }} 2>&1 || true
            exit 1
          fi

      # The suite defaults TYPEDB_ADDRESS to :1730; the service is on :1729.
      - name: Run Node integration suite
        env:
          USE_DOCKER: false
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_VERSION: ${{ matrix.typedb-version }}
        run: npm run test:integration

      - name: Run generated projection live smoke
        env:
          USE_DOCKER: false
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: 8000
          TYPEDB_VERSION: ${{ matrix.typedb-version }}
          TYPE_BRIDGE_ACCEPTANCE_SEMANTIC_PROFILE: ${{ matrix.semantic-profile }}
          TYPE_BRIDGE_NODE_INTG_DATABASE: type_bridge_projection_live
        run: npm run test:projection-integration

  # Version-gate cells: each cell boots a server and checks either a positive
  # connect path or the expected rejection class.
  #   POS-grpc-fallback-band8: wrong HTTP port still connects through gRPC band 8.
  #   NEG-window: Database.connect() rejects unsupported servers.
  #   NEG-driver: Database.driver rejects incompatible installed Python drivers.
  #   NEG-driver-band9: the asymmetric 3.12 pair — a band-9 driver against a
  #     3.11 server is rejected, while band-8 against 3.12 is served.
  # Retired 3.10 servers are rejected before data work. Cell versions mirror
  # the version SSOT in crates/core and the compatibility table.
  version-gate-cells:
    name: Version gate (${{ matrix.cell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: POS-grpc-fallback-band8
            typedb-server: "typedb/typedb:3.11.5"
            python-driver: "3.11.5"
            probe: connect
            http-port: 1
            expect: ok
          - cell: NEG-window
            typedb-server: "typedb/typedb:3.10.4"
            python-driver: "3.11.5"
            probe: connect
            http-port: 8000
            expect: window
          - cell: NEG-driver
            typedb-server: "typedb/typedb:3.11.5"
            python-driver: "3.10.0"
            probe: driver
            http-port: 8000
            expect: installed
          # Asymmetric band acceptance (measured live): a band-9 (3.12) driver
          # is refused by a 3.11 server even though the reverse pair —
          # band-8 driver against a 3.12 server — is served.
          - cell: NEG-driver-band9
            typedb-server: "typedb/typedb:3.11.5"
            python-driver: "3.12.1"
            probe: driver
            http-port: 8000
            expect: installed

    services:
      typedb:
        image: ${{ matrix.typedb-server }}
        ports:
          - 1729:1729
          # TypeDB HTTP API; the connect-time version gate probes /v1/version.
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-gate-v2-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install the cell's Python driver
        run: uv pip install "typedb-driver==${{ matrix.python-driver }}"

      - name: Wait for TypeDB server to be ready
        run: |
          for i in {1..30}; do
            if nc -z localhost 1729 2>/dev/null; then
              echo "TypeDB ready on 1729"
              break
            fi
            sleep 2
          done
          nc -z localhost 1729

      - name: Assert version-gate cell
        run: uv run python scripts/ci/assert_gate_rejection.py --address localhost:1729 --probe ${{ matrix.probe }} --http-port ${{ matrix.http-port }} --expect ${{ matrix.expect }}
