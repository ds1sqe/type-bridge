name: Release

on:
  push:
    tags:
      - 'v*'

# Ensure only one release workflow runs at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Run tests before releasing
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check .

      - name: Run cargo test
        working-directory: type-bridge-core
        run: cargo test --all-targets

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  # Publish Rust crates to crates.io (dependency order)
  publish-crates:
    name: Publish Rust crates to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish type-bridge-core-lib
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p type-bridge-core-lib || true

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-orm-derive
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p type-bridge-orm-derive || true

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-orm
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p type-bridge-orm || true

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-server
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p type-bridge-server || true

  # Build type-bridge-core wheels for all platforms
  build-core-wheels:
    name: Build core wheel (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: core-wheels-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: core-wheels-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: core-wheels-macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: core-wheels-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: core-wheels-windows-x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (Linux aarch64 cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.13
          manylinux: auto
          working-directory: type-bridge-core

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: type-bridge-core/dist/*.whl

  # Build type-bridge-core sdist (fallback for exotic platforms)
  build-core-sdist:
    name: Build core sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: type-bridge-core

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-sdist
          path: type-bridge-core/dist/*.tar.gz

  # Build pure-Python type-bridge package
  build-python:
    name: Build type-bridge
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # Publish type-bridge-core to PyPI (must complete before type-bridge)
  publish-core-pypi:
    name: Publish type-bridge-core to PyPI
    needs: [build-core-wheels, build-core-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download core wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: core-wheels-*
          path: dist/
          merge-multiple: true

      - name: Download core sdist
        uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Publish type-bridge to PyPI (after core is available)
  publish-python-pypi:
    name: Publish type-bridge to PyPI
    needs: [build-python, publish-core-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Create draft GitHub Release with all artifacts
  github-release:
    name: Create GitHub Release
    needs: [publish-python-pypi, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download core wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: core-wheels-*
          path: dist/
          merge-multiple: true

      - name: Download core sdist
        uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: dist/

      - name: Download Python build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
