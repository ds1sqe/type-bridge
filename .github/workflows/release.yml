name: Release

on:
  push:
    tags:
      - 'v2.1.0'
  workflow_dispatch:
    inputs:
      release_channel:
        description: Validate the 2.1.0 release identity or recover the accepted v2.0.0 tag run
        required: true
        type: choice
        default: candidate
        options:
          - candidate
          - stable
          - recovery
      recovery_run_id:
        description: Exact failed v2.0.0 tag run; required only for recovery
        required: false
        type: string
        default: ''
      recovery_mode:
        description: Verify recovery inputs without mutation before explicitly publishing
        required: false
        type: choice
        default: verify
        options:
          - verify
          - publish

# The event allowlist above is the sole release-identity selector. A manual run
# validates one fixed current identity without mutation. The recovery channel
# is pinned below to the one accepted v2.0.0 tag run whose preflight failed
# before any publisher executed.
env:
  # Candidate acceptance verifies the exact stable bytes before the stable tag exists.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'recovery' && 'v2.0.0' || 'v2.1.0' }}
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'recovery' && '2.0.0' || '2.1.0' }}
  PYTHON_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'recovery' && '2.0.0' || '2.1.0' }}
  SERVER_OCI_MINOR_ALIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'recovery' && '2.0' || '2.1' }}
  RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}
  RELEASE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'recovery' && 'aacf4d16486a3a3bae47c3b10c1d526c587dd7a7' || github.sha }}
  RELEASE_ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'recovery' && inputs.recovery_run_id || github.run_id }}
  RELEASE_RECOVERY_MANIFEST_SHA256: f8d5b2d04ad01a45694aecdd171846443bfd511a9363ab771e5f182c6bd17d2d

# Ensure only one release workflow runs at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Run tests before releasing
  test:
    name: Test
    if: github.event_name != 'workflow_dispatch' || inputs.release_channel != 'recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check .

      - name: Run cargo test
        working-directory: type-bridge-core
        run: cargo test --all-targets

      - name: Check alternate serde_json backends
        working-directory: type-bridge-core
        run: cargo test -p type-bridge-contract --features serde-backend-conformance

      - name: Check released validation-rule wire without feature unification
        working-directory: type-bridge-core
        env:
          CARGO_TARGET_DIR: target/rule-wire-standalone
        run: >-
          cargo test --locked
          --manifest-path crates/core/tests/fixtures/rule-wire-standalone/Cargo.toml

      - name: Install generated Rust MSRV
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check generated Rust projection on MSRV 1.88
        working-directory: type-bridge-core
        run: >-
          cargo +1.88.0 test --locked
          -p type-bridge-schema-codegen --test rust_acceptance
          generated_rust_crate_compiles_rejects_invalid_types_and_runs -- --exact

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  # Bind the selected channel to every public Python/npm manifest before any
  # registry mutation is allowed.
  validate-release-identity:
    name: Validate release identity
    needs: test
    runs-on: ubuntu-latest
    outputs:
      cargo_candidate_artifact_digest: ${{ steps.upload-cargo-candidate.outputs.artifact-digest }}
      cargo_candidate_manifest_sha256: ${{ steps.cargo-candidate.outputs.manifest_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install pinned Rust toolchain for native notice validation
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Install pinned cargo-about
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-about@0.9.1

      - name: Verify locked native dependency notice
        run: python scripts/ci/generate_native_dependency_notice.py --check

      - name: Validate first-party public Cargo docs
        run: python scripts/ci/validate_cargo_rustdoc.py

      # These namespaced 3.12.0 keys are historical 1.5.x compatibility
      # artifacts, never current graph inputs.
      - name: Verify historical band-9 registry compatibility keys
        run: python scripts/ci/validate_historical_band9_registry.py

      - name: Build the exact Cargo release candidate
        id: cargo-candidate
        run: |
          set -euo pipefail
          candidate="type-bridge-core/target/cargo-release-candidate"
          python scripts/ci/cargo_release_candidate.py build \
            --output "$candidate" \
            --core-workspace type-bridge-core
          manifest_sha256="$(sha256sum "$candidate/cargo-release-candidate.json" | cut -d' ' -f1)"
          test "${#manifest_sha256}" -eq 64
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Validate exact packaged Rust release graph
        run: >-
          python scripts/ci/validate_rust_release_artifacts.py
          --candidate-bundle type-bridge-core/target/cargo-release-candidate
          --expected-release-version "$RELEASE_VERSION"
          --expected-manifest-sha256 "${{ steps.cargo-candidate.outputs.manifest_sha256 }}"
          --repository-root .

      - name: Accept exact packaged Cargo external consumers
        run: >-
          python scripts/ci/validate_cargo_external_consumers.py
          --candidate-bundle type-bridge-core/target/cargo-release-candidate
          --expected-release-version "$RELEASE_VERSION"
          --expected-manifest-sha256 "${{ steps.cargo-candidate.outputs.manifest_sha256 }}"
          --toolchain 1.94.1

      - name: Preflight exact crates.io keys without upload
        run: >-
          python scripts/ci/publish_cargo_release_candidate.py preflight
          --bundle type-bridge-core/target/cargo-release-candidate
          --expected-release-version "$RELEASE_VERSION"
          --expected-manifest-sha256 "${{ steps.cargo-candidate.outputs.manifest_sha256 }}"

      # Bind Python, npm, Cargo, and OCI artifacts to one release identity.
      - name: Validate identity and retained TypeDB package provenance
        run: |
          python scripts/ci/validate_release_identity.py \
            --artifact-contract cargo-inclusive \
            --release-channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --workspace type-bridge-core/Cargo.toml \
            --root-python pyproject.toml \
            --root-python-init type_bridge/__init__.py \
            --core-python type-bridge-core/pyproject.toml \
            --node-package type-bridge-core/crates/node/package.json \
            --node-package-lock type-bridge-core/crates/node/package-lock.json \
            --release-workflow .github/workflows/release.yml

      # Keep the owner-frozen official 3.12.1 graph check read-only. It is an
      # artifact/provenance input, not a crates.io publication precondition.
      - name: Validate the owner-frozen official TypeDB 3.12.1 driver graph
        run: |
          python scripts/ci/validate_latest_typedb_driver_pin.py \
            --committed-cutoff

      - name: Upload accepted Cargo release candidate
        id: upload-cargo-candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-release-candidate
          path: type-bridge-core/target/cargo-release-candidate/
          if-no-files-found: error
          retention-days: 7

  # One non-mutating channel gate must pass after every public candidate has
  # been accepted. Credential checks apply only to the stable tag path.
  channel-preflight:
    name: Preflight selected release channel
    needs: [validate-release-identity, accept-python-artifacts, accept-node-package, accept-live-artifact-parity, accept-server-oci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      # crates.io has no non-mutating endpoint that proves a granular token
      # may publish every candidate crate. Fail closed on the credential's
      # local shape before npm performs the first irreversible registry write.
      - name: Validate Cargo publication credential shape
        if: github.event_name == 'push' && github.ref == 'refs/tags/v2.1.0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys

          token = os.environ.get("CARGO_REGISTRY_TOKEN")
          if not token or token != token.strip():
              print(
                  "CARGO_REGISTRY_TOKEN is required and must not have surrounding whitespace.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      # npm exposes no package-scoped, non-mutating command that proves a
      # granular token can publish. Authenticate here, then make npm's exact
      # package PUT the first registry mutation so it is authoritative.
      - name: Authenticate npm publication credential
        if: github.event_name == 'push' && github.ref == 'refs/tags/v2.1.0'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is required for an atomic cross-registry release." >&2
            exit 1
          fi
          npm install --global --ignore-scripts npm@11.18.0
          test "$(npm --version)" = "11.18.0"
          authenticated_user="$(
            npm whoami --registry=https://registry.npmjs.org
          )"
          test -n "$authenticated_user"

  # Freeze one annotated-tag object before the first registry mutation. Every
  # publisher rechecks this object immediately before writing so a deleted or
  # replaced tag cannot turn an accepted candidate into a different release.
  release-tag-preflight:
    name: Freeze immutable release tag
    if: >-
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/tags/v2.1.0' &&
          needs.channel-preflight.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master' &&
          inputs.release_channel == 'recovery' &&
          inputs.recovery_mode == 'publish' &&
          inputs.recovery_run_id == '30612912483' &&
          needs.recovery-preflight.result == 'success'
        )
      )
    needs: [channel-preflight, recovery-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_object: ${{ steps.freeze-tag.outputs.tag_object }}
    steps:
      - name: Freeze exact annotated tag object
        id: freeze-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_ref_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_ref_json")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$tag_object" = \
              "a4cec6478ad4e764f039e51eabcbb68d45efd45a"
          fi
          tag_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$RELEASE_REVISION"
          printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"

  # Publish the complete Rust graph only from the accepted stable tag. The
  # helper proves both registry authorities expose the exact local checksum
  # before an existing immutable version can be treated as success.
  publish-crates:
    name: Publish Rust crates to crates.io
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/tags/v2.1.0' &&
      needs.release-tag-preflight.result == 'success' &&
      needs.validate-release-identity.result == 'success' &&
      needs.publish-node-npm.result == 'success'
    needs: [release-tag-preflight, publish-node-npm, validate-release-identity]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download accepted Cargo release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-release-candidate
          path: tmp/cargo-release-candidate

      - name: Verify Cargo candidate artifact and manifest digests
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.validate-release-identity.outputs.cargo_candidate_artifact_digest }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.validate-release-identity.outputs.cargo_candidate_manifest_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifacts_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          )"
          count="$(
            jq '[.artifacts[] | select(.name == "cargo-release-candidate" and .expired == false)] | length' \
              <<<"$artifacts_json"
          )"
          test "$count" = 1
          service_digest="$(
            jq -r '.artifacts[] | select(.name == "cargo-release-candidate" and .expired == false) | .digest' \
              <<<"$artifacts_json"
          )"
          test "$service_digest" = "sha256:${EXPECTED_ARTIFACT_DIGEST}"
          python scripts/ci/cargo_release_candidate.py validate \
            --bundle tmp/cargo-release-candidate \
            --expected-release-version "$RELEASE_VERSION" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"

      - name: Revalidate frozen release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.release-tag-preflight.outputs.tag_object }}
        run: |
          set -euo pipefail
          tag_ref_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_ref_json")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          test "$tag_object" = "$EXPECTED_RELEASE_TAG_OBJECT"
          tag_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$RELEASE_REVISION"

      - name: Publish accepted crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.validate-release-identity.outputs.cargo_candidate_manifest_sha256 }}
        run: >-
          python scripts/ci/publish_cargo_release_candidate.py publish
          --bundle tmp/cargo-release-candidate
          --expected-release-version "$RELEASE_VERSION"
          --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"

  # Build type-bridge-core wheels for all platforms
  build-core-wheels:
    name: Build core wheel (${{ matrix.target }})
    needs: [validate-release-identity, build-python]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: core-wheels-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: core-wheels-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: core-wheels-macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: core-wheels-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: core-wheels-windows-x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          # The manylinux aarch64 compiler does not define the ARM ACLE macro
          # __ARM_ARCH that ring's pregenerated assembly requires. The variable
          # name is target-suffixed, so it only affects the aarch64 Linux wheel.
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}
        with:
          maturin-version: v1.14.1
          rust-toolchain: 1.94.1
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.13
          manylinux: auto
          working-directory: type-bridge-core

      - name: Download exact root Python distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: tmp/python-v2-platform-root

      - name: Execute target-native V2 authoring artifact
        run: >-
          python scripts/ci/run_python_v2_platform_artifact.py
          --root-dist-dir tmp/python-v2-platform-root
          --core-dist-dir type-bridge-core/dist
          --work-dir "${{ runner.temp }}/type-bridge-v2-platform-artifact"
          --expected-version "${{ env.PYTHON_RELEASE_VERSION }}"
          --source-root "${{ github.workspace }}"
          --declared-schema
          tests/fixtures/query-v2-model-remote-parity-declared.json

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: type-bridge-core/dist/*.whl
          if-no-files-found: error

  # Build type-bridge-core sdist (fallback for exotic platforms)
  build-core-sdist:
    name: Build core sdist
    needs: validate-release-identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          rust-toolchain: 1.94.1
          command: sdist
          args: --out dist
          working-directory: type-bridge-core

      - name: Upload sdist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-sdist
          path: type-bridge-core/dist/*.tar.gz
          if-no-files-found: error

  # Build pure-Python type-bridge package
  build-python:
    name: Build type-bridge
    needs: validate-release-identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Build package
        run: uv build

      - name: Prepare generated Python live fixture
        run: >-
          scripts/ci/prepare_generated_live_fixture.sh python
          tmp/release-generated-python

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload generated Python live fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-python-live-fixture
          path: tmp/release-generated-python
          if-no-files-found: error

  # Validate every immutable Python artifact produced by this workflow before
  # either distribution can reach PyPI. Archive, inventory, platform-tag,
  # metadata, and hash checks cover all five core wheels plus both wheel/sdist
  # pairs. Every wheel has already executed a V2 authoring probe on its native
  # target; Linux x86_64 and both sdists receive the deeper isolated consumer
  # matrix here, including the wheel pair's PEP 561 surface.
  accept-python-artifacts:
    name: Accept Python release artifacts (${{ matrix.python-version }})
    needs: [build-core-wheels, build-core-sdist, build-python]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13.5", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_PREFERENCE: only-system
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Download all core wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-wheels-*
          path: tmp/release-python-artifacts/core-wheels
          merge-multiple: true

      - name: Download core sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-sdist
          path: tmp/release-python-artifacts/core-sdist

      - name: Download root Python distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: tmp/release-python-artifacts/root

      - name: Download generated Python fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-python-live-fixture
          path: tmp/release-python-artifacts/generated

      - name: Validate exact Python release inventory
        run: |
          version="$PYTHON_RELEASE_VERSION"
          python scripts/ci/validate_python_release_artifacts.py \
            --core-wheels-dir tmp/release-python-artifacts/core-wheels \
            --core-sdist-dir tmp/release-python-artifacts/core-sdist \
            --root-dist-dir tmp/release-python-artifacts/root \
            --expected-version "$version" \
            --manifest tmp/release-python-artifacts/manifest.json

      # The candidate core is deliberately only discoverable through the
      # candidate wheel directory; the root wheel must resolve the exact pair.
      - name: Prove Python facade/core resolver lockstep
        run: |
          set -euo pipefail
          mapfile -t root_wheels < <(
            find tmp/release-python-artifacts/root -maxdepth 1 -type f \
              -name 'type_bridge-*.whl' -print
          )
          if [[ ${#root_wheels[@]} -ne 1 ]]; then
            printf 'Expected exactly one root Python wheel, found %s\n' \
              "${#root_wheels[@]}" >&2
            exit 1
          fi
          resolver_venv="$GITHUB_WORKSPACE/tmp/release-python-resolver-lockstep"
          uv venv --python python "$resolver_venv"
          uv pip install --python "$resolver_venv/bin/python" \
            --find-links tmp/release-python-artifacts/core-wheels \
            "${root_wheels[0]}"
          version="$PYTHON_RELEASE_VERSION"
          "$resolver_venv/bin/python" -I - "$version" <<'PY'
          import importlib.metadata
          import sys

          expected = sys.argv[1]
          for distribution in ("type-bridge", "type-bridge-core"):
              actual = importlib.metadata.version(distribution)
              if actual != expected:
                  raise SystemExit(
                      f"{distribution} resolver version mismatch: "
                      f"actual={actual!r}, expected={expected!r}"
                  )
          PY
          "$resolver_venv/bin/type-bridge" schema --help > /dev/null

      - name: Prepare generated consumer interpreter and Pyright
        run: |
          uv venv --python python tmp/release-python-tools
          uv pip install --python tmp/release-python-tools/bin/python \
            'pydantic>=2.12.4' 'isodate==0.7.2' 'jinja2>=3.1.0' \
            'typer>=0.15.0' 'pyright>=1.1.407' 'auditwheel==6.7.0'

      - name: Audit both immutable GNU wheels against manylinux policy
        run: |
          tmp/release-python-tools/bin/python \
            scripts/ci/audit_manylinux_release_wheels.py \
            --manifest tmp/release-python-artifacts/manifest.json \
            --core-wheels-dir tmp/release-python-artifacts/core-wheels

      - name: Run isolated generated Python artifact acceptance
        run: |
          set -euo pipefail
          mapfile -t core_wheels < <(
            find tmp/release-python-artifacts/core-wheels -maxdepth 1 -type f \
              -name 'type_bridge_core-*linux*x86_64.whl' -print
          )
          mapfile -t root_wheels < <(
            find tmp/release-python-artifacts/root -maxdepth 1 -type f \
              -name 'type_bridge-*.whl' -print
          )
          mapfile -t core_sdists < <(
            find tmp/release-python-artifacts/core-sdist -maxdepth 1 -type f \
              -name 'type_bridge_core-*.tar.gz' -print
          )
          mapfile -t root_sdists < <(
            find tmp/release-python-artifacts/root -maxdepth 1 -type f \
              -name 'type_bridge-*.tar.gz' -print
          )
          for count in \
            "core wheel:${#core_wheels[@]}" \
            "root wheel:${#root_wheels[@]}" \
            "core sdist:${#core_sdists[@]}" \
            "root sdist:${#root_sdists[@]}"; do
            if [[ "${count##*:}" -ne 1 ]]; then
              printf 'Expected exactly one %s, found %s\n' \
                "${count%%:*}" "${count##*:}" >&2
              exit 1
            fi
          done

          python scripts/ci/run_generated_python_artifact.py \
            --root-wheel "${root_wheels[0]}" \
            --core-wheel "${core_wheels[0]}" \
            --generated-stage tmp/release-python-artifacts/generated \
            --python "$PWD/tmp/release-python-tools/bin/python" \
            --pyright "$PWD/tmp/release-python-tools/bin/pyright"

          sdist_venv="$RUNNER_TEMP/release-generated-sdist"
          sdist_consumer="$RUNNER_TEMP/release-generated-sdist-consumer"
          uv venv --python python "$sdist_venv"
          uv pip install --python "$sdist_venv/bin/python" \
            "${core_sdists[0]}" "${root_sdists[0]}"
          mkdir -p "$sdist_consumer/generated"
          cp -R tmp/release-python-artifacts/generated/. "$sdist_consumer/generated/"
          cp type-bridge-core/crates/schema-codegen/tests/acceptance/runtime_check.py \
            "$sdist_consumer/runtime_check.py"
          "$sdist_venv/bin/python" -I - \
            "$sdist_consumer/generated" "$sdist_consumer/runtime_check.py" <<'PY'
          import runpy
          import sys
          from pathlib import Path

          generated = Path(sys.argv[1]).resolve()
          runtime_check = Path(sys.argv[2]).resolve()
          sys.path.insert(0, str(generated))
          runpy.run_path(str(runtime_check), run_name="__main__")
          PY

          driver_venv="$GITHUB_WORKSPACE/tmp/release-python-driver-smoke"
          uv venv --python python "$driver_venv"
          uv pip install --python "$driver_venv/bin/python" \
            "${root_wheels[0]}[typedb-driver]" "${core_wheels[0]}"
          version="$PYTHON_RELEASE_VERSION"
          "$driver_venv/bin/python" -I \
            tests/compat/typedb_driver_native/probe.py \
            --expected-version "$version"
      - name: Run generated-only CLI wheel acceptance
        run: |
          set -euo pipefail
          mapfile -t core_wheels < <(
            find tmp/release-python-artifacts/core-wheels -maxdepth 1 -type f \
              -name 'type_bridge_core-*linux*x86_64.whl' -print
          )
          mapfile -t root_wheels < <(
            find tmp/release-python-artifacts/root -maxdepth 1 -type f \
              -name 'type_bridge-*.whl' -print
          )
          cli_venv="$GITHUB_WORKSPACE/tmp/release-python-cli-smoke"
          uv venv --python python "$cli_venv"
          uv pip install --python "$cli_venv/bin/python" \
            "${root_wheels[0]}" "${core_wheels[0]}"

          # Only canonical workspace authoring is exercised from candidate wheels.
          "$cli_venv/bin/type-bridge" schema --help > /dev/null
          "$cli_venv/bin/type-bridge" migration --help > /dev/null
          workspace=$(mktemp -d)
          mkdir -p "$workspace/schema/fragments" "$workspace/migrations/v2"
          printf '%s\n' \
            'format: typebridge.workspace/v1' \
            'schema:' \
            '  root: schema/schema.yaml' \
            '  ownership: exclusive' \
            '  managed-scope: wheel-smoke' \
            'compatibility:' \
            '  semantic-profile: typedb-3.12.1/v1' \
            'migrations:' \
            '  directory: migrations/v2' \
            '  app-label: wheelsmoke' \
            'bindings:' \
            '  python:' \
            '    output: generated/python' \
            'artifacts:' \
            '  schema-authority:' \
            '    output: generated/schema-authority.json' \
            > "$workspace/typebridge.yaml"
          "$cli_venv/bin/type-bridge" \
            --manifest="$workspace/typebridge.yaml" --version > /dev/null
          "$cli_venv/bin/type-bridge" \
            --manifest "$workspace/typebridge.yaml" -V > /dev/null
          printf '%s\n' \
            'format: typebridge.schema-set/v1' \
            'sources: [fragments/*.yaml]' \
            > "$workspace/schema/schema.yaml"
          printf '%s\n' \
            'format: typebridge.schema/v2' \
            'attributes:' \
            '  nickname: { value: string }' \
            'entities:' \
            '  person: { owns: [nickname] }' \
            > "$workspace/schema/fragments/model.yaml"
          (
            cd "$workspace"
            "$cli_venv/bin/type-bridge" schema check
            "$cli_venv/bin/type-bridge" schema generate
            "$cli_venv/bin/type-bridge" migration make --name init
          )
          test -f "$workspace/migrations/v2/0001_init.tbmigration.json"
          test -s "$workspace/generated/schema-authority.json"
          test -n "$(ls "$workspace/generated/python")"

  # Build every native target that the public loader advertises. The pack job
  # fans these immutable, uniquely named outputs into one portable tarball.
  build-node-native:
    name: Build Node native module (${{ matrix.target }})
    needs: validate-release-identity
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-latest
            artifact: node-native-linux-x64-gnu
            filename: type_bridge_node.linux-x64-gnu.node
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            artifact: node-native-linux-arm64-gnu
            filename: type_bridge_node.linux-arm64-gnu.node
          - target: darwin-x64
            runner: macos-15-intel
            artifact: node-native-darwin-x64
            filename: type_bridge_node.darwin-x64.node
          - target: darwin-arm64
            runner: macos-14
            artifact: node-native-darwin-arm64
            filename: type_bridge_node.darwin-arm64.node
          - target: win32-x64-msvc
            runner: windows-latest
            artifact: node-native-win32-x64-msvc
            filename: type_bridge_node.win32-x64-msvc.node
          - target: win32-arm64-msvc
            runner: windows-11-arm
            artifact: node-native-win32-arm64-msvc
            filename: type_bridge_node.win32-arm64-msvc.node
    defaults:
      run:
        working-directory: type-bridge-core/crates/node
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build native module
        run: npm run build:native

      - name: Upload immutable native module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: type-bridge-core/crates/node/${{ matrix.filename }}
          if-no-files-found: error

  # Run source/declaration gates over the one compiled build, pack exactly once,
  # and bind the tarball identity to repository metadata and the release tag
  # before its first upload.
  pack-node-package:
    name: Pack Node release candidate
    needs: build-node-native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: type-bridge-core/crates/node
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: type-bridge-core/crates/node/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Install Node dependencies
        run: npm ci

      - name: Download all immutable native modules
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: node-native-*
          path: type-bridge-core/crates/node
          merge-multiple: true

      - name: Verify exact native fan-in inventory
        run: |
          python "$GITHUB_WORKSPACE/scripts/ci/validate_node_release_package.py" \
            --native-directory .

      - name: Build TypeScript surface once
        run: npm run build:types

      - name: Typecheck
        run: npm run typecheck

      - name: Compile generated projection integration harness
        run: npm run typecheck:projection-integration

      - name: Prepare generated Node live fixture
        run: >-
          "$GITHUB_WORKSPACE/scripts/ci/prepare_generated_live_fixture.sh" node
          "$GITHUB_WORKSPACE/tmp/release-generated-node"

      - name: Thin-binding scope probe
        run: npm run scope:probe

      - name: Unit tests
        run: npm run test:unit

      - name: DTS comparator tests
        run: npm run test:dts

      - name: DTS baseline parity
        run: npm run dts:parity

      - name: Package smoke
        run: npm run smoke:package

      - name: Pack npm release candidate
        run: |
          package_dir="$GITHUB_WORKSPACE/tmp/release-node-package"
          mkdir -p "$package_dir"
          npm pack --ignore-scripts --pack-destination "$package_dir"

      - name: Validate npm release identity before upload
        run: |
          mapfile -t packages < <(
            find "$GITHUB_WORKSPACE/tmp/release-node-package" \
              -maxdepth 1 -type f -name '*.tgz' -print
          )
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one npm release candidate, found %s\n' \
              "${#packages[@]}" >&2
            exit 1
          fi
          validator_args=(
            --artifact "${packages[0]}"
            --repository-package package.json
            --tag "$RELEASE_TAG"
          )
          if [[ "$RELEASE_CHANNEL" == "candidate" ]]; then
            validator_args+=(--allow-prerelease)
          fi
          python "$GITHUB_WORKSPACE/scripts/ci/validate_node_release_package.py" \
            "${validator_args[@]}"

      - name: Upload immutable npm release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-package
          path: tmp/release-node-package/*.tgz
          if-no-files-found: error

      - name: Upload generated Node live fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-node-live-fixture
          path: tmp/release-generated-node
          if-no-files-found: error

  # Execute the same immutable tarball on every native target. Linux x64 also
  # covers the declared Node 18 engine floor; all targets run on Node 20.
  accept-node-package:
    name: Accept Node package (${{ matrix.target }}, Node ${{ matrix.node-version }})
    needs: pack-node-package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-latest
            node-version: "18"
          - target: linux-x64-gnu
            runner: ubuntu-latest
            node-version: "20"
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            node-version: "20"
          - target: darwin-x64
            runner: macos-15-intel
            node-version: "20"
          - target: darwin-arm64
            runner: macos-14
            node-version: "20"
          - target: win32-x64-msvc
            runner: windows-latest
            node-version: "20"
          - target: win32-arm64-msvc
            runner: windows-11-arm
            node-version: "20"
    defaults:
      run:
        working-directory: type-bridge-core/crates/node
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: type-bridge-core/crates/node/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Download immutable npm release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-package
          path: tmp/release-node-package

      - name: Execute generated-only packed Node consumer
        run: >-
          npm run smoke:packed-package -- --artifact-directory
          "${{ github.workspace }}/tmp/release-node-package"

  # Build the internal V2 smoke executor once from the exact candidate commit.
  # Live artifact consumers use this immutable binary; it is test support, not
  # a release payload and is never published.
  build-v2-smoke-server:
    name: Build V2 smoke server
    needs: validate-release-identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Build exact V2 smoke server
        run: >-
          cargo build --manifest-path type-bridge-core/Cargo.toml
          --release -p type-bridge-server --no-default-features
          --features band9,v2-query
          --example v2_smoke_server

      - name: Upload immutable V2 smoke server
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-smoke-server
          path: type-bridge-core/target/release/examples/v2_smoke_server
          if-no-files-found: error

  # Build one immutable, daemon-importable OCI layout per supported platform.
  # Candidate and stable paths share these bytes; neither job pushes a registry.
  build-server-oci:
    name: Build server OCI (${{ matrix.platform }})
    needs: validate-release-identity
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.34.1
          driver-opts: |
            image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Build immutable platform OCI layout
        env:
          SERVER_OCI_PLATFORM: ${{ matrix.platform }}
          SERVER_OCI_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show --no-patch --format=%ct "$GITHUB_SHA")"
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]]
          created="$(
            date --utc --date="@${source_date_epoch}" '+%Y-%m-%dT%H:%M:%SZ'
          )"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          release_identity="${RELEASE_TAG}@${GITHUB_SHA}"
          output="$RUNNER_TEMP/server-oci-${SERVER_OCI_ARCH}"
          mkdir -p "$output"
          archive="$output/type-bridge-server-${SERVER_OCI_ARCH}.oci.tar"
          docker buildx build \
            --file type-bridge-core/Dockerfile.server \
            --platform "$SERVER_OCI_PLATFORM" \
            --provenance=false \
            --sbom=false \
            --tag \
              "ghcr.io/ds1sqe/type-bridge-server:${RELEASE_VERSION}-${SERVER_OCI_ARCH}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --build-arg "RELEASE_VERSION=${RELEASE_VERSION}" \
            --build-arg "CREATED=${created}" \
            --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
            --build-arg "RELEASE_IDENTITY=${release_identity}" \
            --output \
              "type=oci,dest=${archive},oci-mediatypes=false,rewrite-timestamp=true" \
            type-bridge-core
          python scripts/ci/validate_server_oci_layout.py \
            --archive "$archive" \
            --platform "$SERVER_OCI_PLATFORM" \
            --version "$RELEASE_VERSION" \
            --revision "$GITHUB_SHA" \
            --created "$created" \
            --release-identity "$release_identity" \
            --report "$output/layout-report.json"
          (
            cd "$output"
            sha256sum "$(basename "$archive")" > layout.sha256
          )

      - name: Upload immutable platform OCI layout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-oci-layout-${{ matrix.architecture }}
          path: ${{ runner.temp }}/server-oci-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14

  # Import and execute the exact layout bytes. The arm64 leg runs under QEMU
  # on amd64 so architecture startup is proved rather than inferred.
  accept-server-oci:
    name: Accept server OCI (${{ matrix.platform }})
    needs: build-server-oci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64
    services:
      typedb:
        # Registry index resolves to amd64 config
        # sha256:f683eed7f07c2c519caa795afbc1cd4df4f83c6422ad2cc07406f28f7537423a.
        image: typedb/typedb:3.12.1@sha256:4224951114b044d52e2fe48108be26ae2734726041dae8d63453ecd407fe2422
        ports:
          - 1729:1729
          - 8000:8000
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU for arm64 runtime proof
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Download immutable platform OCI layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-oci-layout-${{ matrix.architecture }}
          path: tmp/server-oci-layout-${{ matrix.architecture }}

      - name: Import exact layout into the runtime daemon
        env:
          SERVER_OCI_ARCH: ${{ matrix.architecture }}
          SERVER_OCI_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          archive="$(
            find "tmp/server-oci-layout-${SERVER_OCI_ARCH}" \
              -maxdepth 1 -type f -name '*.oci.tar' -print
          )"
          test -n "$archive"
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          (
            cd "tmp/server-oci-layout-${SERVER_OCI_ARCH}"
            sha256sum --check layout.sha256
          )
          image="type-bridge-server:accepted-${GITHUB_SHA}-${SERVER_OCI_ARCH}"
          conversion_dir="$RUNNER_TEMP/server-oci-conversion-${SERVER_OCI_ARCH}"
          mkdir -p "$conversion_dir"
          docker_archive="$conversion_dir/server.docker.tar"
          python scripts/ci/run_pinned_skopeo.py \
            --write-directory "$conversion_dir" -- \
            copy --preserve-digests \
            "oci-archive:${archive}" "docker-archive:${docker_archive}"
          docker load --input "$docker_archive" > "$conversion_dir/docker-load.txt"
          expected_config="$(
            python -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["config_digest"])' \
              "tmp/server-oci-layout-${SERVER_OCI_ARCH}/layout-report.json"
          )"
          docker tag "$expected_config" "$image"
          actual_config="$(docker image inspect --format '{{.Id}}' "$image")"
          test "$actual_config" = "$expected_config"
          actual_rootfs="$(
            docker image inspect --format '{{json .RootFS.Layers}}' "$image"
          )"
          python - \
            "tmp/server-oci-layout-${SERVER_OCI_ARCH}/layout-report.json" \
            "$actual_rootfs" <<'PY'
          import json
          import sys

          report_path, actual_json = sys.argv[1:]
          expected = json.load(open(report_path, encoding="utf-8"))["rootfs_diff_ids"]
          actual = json.loads(actual_json)
          if actual != expected:
              raise SystemExit(
                  "Socketless Docker import changed accepted rootfs identity: "
                  f"actual={actual!r}, expected={expected!r}"
              )
          PY
          rm -f "$docker_archive" "$conversion_dir/docker-load.txt"
          rmdir "$conversion_dir"
          docker inspect "$image" >/dev/null
          printf 'TYPE_BRIDGE_SERVER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          printf 'TYPE_BRIDGE_SERVER_PLATFORM=%s\n' \
            "$SERVER_OCI_PLATFORM" >> "$GITHUB_ENV"
          printf 'SERVER_OCI_ARCHIVE=%s\n' "$(realpath "$archive")" >> "$GITHUB_ENV"
          printf 'SERVER_OCI_DOCKER_ARCHIVE=%s\n' \
            "$RUNNER_TEMP/type-bridge-server-${SERVER_OCI_ARCH}.docker.tar" \
            >> "$GITHUB_ENV"
          printf 'SERVER_OCI_ACCEPTED_DIR=%s\n' \
            "$RUNNER_TEMP/server-oci-accepted-${SERVER_OCI_ARCH}" \
            >> "$GITHUB_ENV"

      - name: Prove binary identity under deployment restrictions
        run: |
          set -euo pipefail
          expected="type-bridge-server ${RELEASE_VERSION}"
          actual="$(
            docker run --rm \
              --platform "$TYPE_BRIDGE_SERVER_PLATFORM" \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --user 10001:10001 \
              "$TYPE_BRIDGE_SERVER_IMAGE" --version
          )"
          test "$actual" = "$expected"
          test "$(
            docker inspect --format '{{.Config.User}}' \
              "$TYPE_BRIDGE_SERVER_IMAGE"
          )" = "10001:10001"

      - name: Wait for pinned TypeDB
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent \
              http://localhost:8000/v1/version >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ${{ job.services.typedb.id }} >&2 || true
          exit 1

      - name: Run exact-image V1 compatibility and authenticated V2 query
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
          TYPE_BRIDGE_SERVER_STARTUP_TIMEOUT_SECONDS: "180"
        run: >-
          timeout --foreground 15m
          bash scripts/ci/run_exact_ignored_rust_test.sh
          production_binary_serves_v1_health_and_v2_query
          --manifest-path type-bridge-core/Cargo.toml --locked
          -p type-bridge-server --no-default-features
          --features band9,v2-query
          --test v2_query_integration_tests

      - name: Run external generated Rust application through the exact image
        if: matrix.architecture == 'amd64'
        env:
          TYPEDB_ADDRESS: localhost:1729
          TYPEDB_HTTP_PORT: "8000"
          TYPE_BRIDGE_RUST_PROJECTION_INTG_DATABASE: release_rust_projection_live
          ACCEPTANCE_TARGET_DIR: ${{ runner.temp }}/release-rust-projection-target
        run: >-
          timeout --foreground 15m
          bash scripts/ci/run_exact_ignored_rust_test.sh
          generated_rust_projection_round_trips_exact_live_models
          --manifest-path type-bridge-core/Cargo.toml --locked
          -p type-bridge-schema-codegen --test rust_projection_live

      - name: Report runtime packages and image size
        run: |
          set -euo pipefail
          mkdir -p "$SERVER_OCI_ACCEPTED_DIR"
          docker image inspect "$TYPE_BRIDGE_SERVER_IMAGE" \
            --format \
              '{"image_bytes":{{.Size}},"runtime_user":{{json .Config.User}}}' \
            > "$SERVER_OCI_ACCEPTED_DIR/runtime-report.json"
          docker run --rm \
            --platform "$TYPE_BRIDGE_SERVER_PLATFORM" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint /usr/bin/dpkg-query \
            "$TYPE_BRIDGE_SERVER_IMAGE" \
            -W '-f=${Package} ${Version}\n' \
            | LC_ALL=C sort \
            > "$SERVER_OCI_ACCEPTED_DIR/installed-packages.txt"
          docker save --output "$SERVER_OCI_DOCKER_ARCHIVE" \
            "$TYPE_BRIDGE_SERVER_IMAGE"

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.TYPE_BRIDGE_SERVER_IMAGE }}
          format: spdx-json
          output-file: ${{ env.SERVER_OCI_ACCEPTED_DIR }}/server.spdx.json
          artifact-name: server-oci-sbom-${{ matrix.architecture }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.44.0

      - name: Scan exact runtime for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ env.SERVER_OCI_DOCKER_ARCHIVE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: ${{ env.SERVER_OCI_ACCEPTED_DIR }}/trivy.json
          exit-code: 0

      - name: Assemble accepted OCI evidence
        env:
          SERVER_OCI_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          cp "$SERVER_OCI_ARCHIVE" "$SERVER_OCI_ACCEPTED_DIR/"
          cp "tmp/server-oci-layout-${SERVER_OCI_ARCH}/layout-report.json" \
            "$SERVER_OCI_ACCEPTED_DIR/"
          cp "tmp/server-oci-layout-${SERVER_OCI_ARCH}/layout.sha256" \
            "$SERVER_OCI_ACCEPTED_DIR/"

      - name: Upload exact accepted OCI bytes and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-oci-accepted-${{ matrix.architecture }}
          path: ${{ env.SERVER_OCI_ACCEPTED_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce the accepted-image vulnerability and secret gate
        run: >-
          python scripts/ci/validate_trivy_report.py
          "$SERVER_OCI_ACCEPTED_DIR/trivy.json"

  # Execute immutable wheel, npm, generated-fixture, and remote-server
  # candidates together before any registry mutation. Generation and compilation
  # happened in producer jobs; this consumer performs no source build or repack.
  accept-live-artifact-parity:
    name: Accept generated live artifact parity
    needs: [build-core-wheels, build-python, pack-node-package, build-v2-smoke-server]
    runs-on: ubuntu-latest
    services:
      typedb:
        # Registry index resolves to amd64 config
        # sha256:f683eed7f07c2c519caa795afbc1cd4df4f83c6422ad2cc07406f28f7537423a.
        image: typedb/typedb:3.12.1@sha256:4224951114b044d52e2fe48108be26ae2734726041dae8d63453ecd407fe2422
        ports:
          - 1729:1729
          - 8000:8000
    env:
      USE_DOCKER: "false"
      TYPEDB_ADDRESS: localhost:1729
      TYPEDB_HTTP_PORT: "8000"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Download exact Linux x64 core wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-wheels-linux-x86_64
          path: tmp/release-live-artifacts/core

      - name: Download exact root Python distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: tmp/release-live-artifacts/root

      - name: Download exact multi-native npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-package
          path: tmp/release-live-artifacts/node

      - name: Download generated Python live fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-python-live-fixture
          path: tmp/release-live-artifacts/generated-python

      - name: Download generated Node live fixture
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-node-live-fixture
          path: tmp/release-live-artifacts/generated-node

      - name: Download exact V2 smoke server
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v2-smoke-server
          path: tmp/release-live-artifacts/server

      - name: Export exact release candidate paths
        run: |
          set -euo pipefail
          mapfile -t core_wheels < <(
            find tmp/release-live-artifacts/core -maxdepth 1 -type f \
              -name 'type_bridge_core-*linux*x86_64.whl' -print
          )
          mapfile -t root_wheels < <(
            find tmp/release-live-artifacts/root -maxdepth 1 -type f \
              -name 'type_bridge-*.whl' -print
          )
          mapfile -t node_packages < <(
            find tmp/release-live-artifacts/node -maxdepth 1 -type f \
              -name '*.tgz' -print
          )
          mapfile -t smoke_servers < <(
            find tmp/release-live-artifacts/server -maxdepth 1 -type f \
              -name 'v2_smoke_server' -print
          )
          for count in \
            "core wheel:${#core_wheels[@]}" \
            "root wheel:${#root_wheels[@]}" \
            "npm package:${#node_packages[@]}" \
            "smoke server:${#smoke_servers[@]}"; do
            if [[ "${count##*:}" -ne 1 ]]; then
              printf 'Expected exactly one %s candidate, found %s\n' \
                "${count%%:*}" "${count##*:}" >&2
              exit 1
            fi
          done
          python_stage="$GITHUB_WORKSPACE/tmp/release-live-artifacts/generated-python"
          node_stage="$GITHUB_WORKSPACE/tmp/release-live-artifacts/generated-node"
          for required in \
            "$python_stage/generated_v2/__init__.py" \
            "$python_stage/schema-authority.json" \
            "$node_stage/generated_v2/dist/index.js" \
            "$node_stage/generated_foreign/dist/index.js" \
            "$node_stage/schema-authority.json" \
            "$node_stage/harness/tests/projection-integration/generated-package-live.test.js" \
            "$node_stage/harness/package.json"; do
            if [[ ! -f "$required" || -L "$required" ]]; then
              printf 'Generated live fixture is incomplete: %s\n' "$required" >&2
              exit 1
            fi
          done
          chmod +x "${smoke_servers[0]}"
          printf 'TYPE_BRIDGE_CORE_WHEEL=%s\n' \
            "$(realpath "${core_wheels[0]}")" >> "$GITHUB_ENV"
          printf 'TYPE_BRIDGE_ROOT_WHEEL=%s\n' \
            "$(realpath "${root_wheels[0]}")" >> "$GITHUB_ENV"
          printf 'TYPE_BRIDGE_NODE_PACKAGE=%s\n' \
            "$(realpath "${node_packages[0]}")" >> "$GITHUB_ENV"
          printf 'TYPE_BRIDGE_V2_SMOKE_SERVER=%s\n' \
            "$(realpath "${smoke_servers[0]}")" >> "$GITHUB_ENV"
          printf 'TYPE_BRIDGE_GENERATED_PYTHON_STAGE=%s\n' \
            "$(realpath "$python_stage")" >> "$GITHUB_ENV"
          printf 'TYPE_BRIDGE_GENERATED_NODE_STAGE=%s\n' \
            "$(realpath "$node_stage")" >> "$GITHUB_ENV"

      - name: Prepare exact-wheel environment
        run: |
          parity_venv="$RUNNER_TEMP/release-generated-parity"
          uv venv --python python "$parity_venv"
          uv pip install --python "$parity_venv/bin/python" \
            "$TYPE_BRIDGE_CORE_WHEEL" "$TYPE_BRIDGE_ROOT_WHEEL" 'pytest>=9.0.1'

      - name: Prepare exact npm environment
        run: |
          runtime_root="$RUNNER_TEMP/release-node-runtime"
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock \
            --no-save --prefix "$runtime_root" "$TYPE_BRIDGE_NODE_PACKAGE"
          package_root="$runtime_root/node_modules/@type-bridge/node"
          test -f "$package_root/dist/public.js"
          test -f "$package_root/type_bridge_node.linux-x64-gnu.node"
          printf 'TYPE_BRIDGE_NODE_PACKAGE_ROOT=%s\n' \
            "$(realpath "$package_root")" >> "$GITHUB_ENV"

      - name: Wait for TypeDB connect and version endpoints
        run: |
          for i in {1..30}; do
            if nc -z localhost 1729 2>/dev/null \
              && curl --fail --silent http://localhost:8000/v1/version >/dev/null; then
              echo "TypeDB is ready on ports 1729 and 8000"
              break
            fi
            echo "Waiting for TypeDB endpoints... ($i/30)"
            sleep 2
          done
          if ! nc -z localhost 1729 2>/dev/null \
            || ! curl --fail --silent http://localhost:8000/v1/version >/dev/null; then
            echo "ERROR: TypeDB did not become ready within 60 seconds"
            docker logs ${{ job.services.typedb.id }} 2>&1 || true
            exit 1
          fi

      - name: Run exact-wheel generated Python application
        env:
          TYPE_BRIDGE_GENERATED_PARITY_REPORT: ${{ runner.temp }}/release-generated-parity.xml
        run: |
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/release-generated-parity/bin:$PATH" \
            "$RUNNER_TEMP/release-generated-parity/bin/python" -I - <<'PY'
          import importlib
          import os
          import sys
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          environment = Path(sys.prefix).resolve()
          for module_name in ("type_bridge", "type_bridge_core"):
              module = importlib.import_module(module_name)
              module_path = Path(module.__file__).resolve()
              if module_path == workspace or workspace in module_path.parents:
                  raise SystemExit(
                      f"{module_name} leaked to the source checkout: {module_path}"
                  )
              if module_path != environment and environment not in module_path.parents:
                  raise SystemExit(
                      f"{module_name} escaped the exact-wheel environment: {module_path}"
                  )

          import pytest

          sys.path.insert(0, str(workspace))
          test = workspace / "tests/integration/schema/test_generated_projection_live.py"
          raise SystemExit(
              pytest.main(
                  [
                      str(test),
                      "--rootdir",
                      str(workspace),
                      "--import-mode=importlib",
                      "-o",
                      "addopts=",
                      "-m",
                      "integration",
                      "-ra",
                      "--tb=short",
                      f"--junitxml={os.environ['TYPE_BRIDGE_GENERATED_PARITY_REPORT']}",
                  ]
              )
          )
          PY

      - name: Require both generated Python journeys
        env:
          TYPE_BRIDGE_GENERATED_PARITY_REPORT: ${{ runner.temp }}/release-generated-parity.xml
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["TYPE_BRIDGE_GENERATED_PARITY_REPORT"])
          if not report.is_file():
              raise SystemExit(f"Generated parity report is missing: {report}")
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {
              key: sum(int(suite.get(key, "0")) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          expected = {
              "test_generated_package_preserves_application_operation_outcomes_live",
              "test_generated_projection_round_trips_live_models",
          }
          names = {case.get("name") for case in root.iter("testcase")}
          print(f"generated artifact parity: totals={totals} tests={sorted(names)}")
          if totals != {"tests": 2, "failures": 0, "errors": 0, "skipped": 0}:
              raise SystemExit(f"Generated parity did not pass exactly twice: {totals}")
          if names != expected:
              raise SystemExit(f"Unexpected generated parity cases: {sorted(names)}")
          PY

      - name: Run exact-package generated Node application
        working-directory: type-bridge-core/crates/node
        run: >-
          node --test --test-concurrency=1
          "$TYPE_BRIDGE_GENERATED_NODE_STAGE/harness/tests/projection-integration/generated-package-live.test.js"

  # The immutable v2.0.0 tag run accepted every artifact but stopped before
  # mutation because npm's owner-wide ACL endpoint rejected a least-privilege
  # package token. Recovery runs from protected master, preserves the existing
  # tag, and consumes only the committed source-run/artifact ledger.
  recovery-preflight:
    name: Validate v2.0.0 recovery
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.release_channel == 'recovery'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout recovery controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout immutable release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v2.0.0
          fetch-depth: 0
          path: tmp/release-source
          persist-credentials: false

      - name: Bind recovery to the exact annotated tag and source run
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          test "$RECOVERY_RUN_ID" = "30612912483"
          test "$(git -C tmp/release-source cat-file -t refs/tags/v2.0.0)" = tag
          test "$(
            git -C tmp/release-source rev-parse refs/tags/v2.0.0
          )" = "a4cec6478ad4e764f039e51eabcbb68d45efd45a"
          test "$(
            git -C tmp/release-source rev-parse 'refs/tags/v2.0.0^{}'
          )" = "$RELEASE_REVISION"
          test "$RELEASE_REVISION" = \
            "aacf4d16486a3a3bae47c3b10c1d526c587dd7a7"

      - name: Download source-run API evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          mkdir -p tmp/recovery-evidence
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}" \
            > tmp/recovery-evidence/run.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/jobs?per_page=100" \
            > tmp/recovery-evidence/jobs.json
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/artifacts?per_page=100" \
            > tmp/recovery-evidence/artifacts.json

      - name: Download every immutable source-run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*'
          path: tmp/recovery-artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Validate source run, jobs, and artifact bytes
        run: |
          set -euo pipefail
          mkdir -p tmp/recovery-release-evidence
          python scripts/ci/validate_release_recovery.py \
            --manifest .github/release/v2.0.0-recovery.json \
            --expected-manifest-sha256 "$RELEASE_RECOVERY_MANIFEST_SHA256" \
            --run tmp/recovery-evidence/run.json \
            --jobs tmp/recovery-evidence/jobs.json \
            --artifacts tmp/recovery-evidence/artifacts.json \
            --artifact-root tmp/recovery-artifacts \
            | tee tmp/recovery-release-evidence/validation-summary.json
          cp .github/release/v2.0.0-recovery.json \
            tmp/recovery-release-evidence/v2.0.0-recovery-manifest.json
          cp tmp/recovery-evidence/run.json \
            tmp/recovery-release-evidence/source-run.json
          cp tmp/recovery-evidence/jobs.json \
            tmp/recovery-release-evidence/source-jobs.json
          cp tmp/recovery-evidence/artifacts.json \
            tmp/recovery-release-evidence/source-artifacts.json

      - name: Upload immutable recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-recovery-evidence
          path: tmp/recovery-release-evidence
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Authenticate npm publication credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is required for the v2.0.0 recovery." >&2
            exit 1
          fi
          npm install --global --ignore-scripts npm@11.18.0
          test "$(npm --version)" = "11.18.0"
          authenticated_user="$(
            npm whoami --registry=https://registry.npmjs.org
          )"
          test "$authenticated_user" = "ds1sqe"

  # Import the two already-accepted platform manifests without rebuilding,
  # assemble their stable multi-platform index, and attach registry evidence.
  publish-server-oci:
    name: Publish accepted TypeBridge server OCI
    if: >-
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/tags/v2.1.0' &&
          needs.channel-preflight.result == 'success' &&
          needs.release-tag-preflight.result == 'success' &&
          needs.accept-server-oci.result == 'success' &&
          needs.publish-node-npm.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master' &&
          inputs.release_channel == 'recovery' &&
          inputs.recovery_mode == 'publish' &&
          inputs.recovery_run_id == '30612912483' &&
          needs.recovery-preflight.result == 'success' &&
          needs.release-tag-preflight.result == 'success' &&
          needs.publish-node-npm.result == 'success'
        )
      )
    needs: [channel-preflight, recovery-preflight, release-tag-preflight, accept-server-oci, publish-node-npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
          persist-credentials: false

      - name: Checkout recovery payload controls
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: tmp/recovery-controls
          persist-credentials: false

      - name: Download accepted amd64 OCI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-oci-accepted-amd64
          path: tmp/server-oci/amd64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RELEASE_ARTIFACT_RUN_ID }}

      - name: Download accepted arm64 OCI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-oci-accepted-arm64
          path: tmp/server-oci/arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RELEASE_ARTIFACT_RUN_ID }}

      - name: Revalidate recovery OCI payloads
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          validator=tmp/recovery-controls/scripts/ci/validate_release_recovery_payloads.py
          manifest=tmp/recovery-controls/.github/release/v2.0.0-recovery.json
          python "$validator" \
            --manifest "$manifest" \
            --expected-manifest-sha256 "$RELEASE_RECOVERY_MANIFEST_SHA256" \
            --artifact-root tmp/server-oci/amd64 \
            --artifact server-oci-accepted-amd64
          python "$validator" \
            --manifest "$manifest" \
            --expected-manifest-sha256 "$RELEASE_RECOVERY_MANIFEST_SHA256" \
            --artifact-root tmp/server-oci/arm64 \
            --artifact server-oci-accepted-arm64

      - name: Set up pinned Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          version: v0.34.1
          driver-opts: |
            image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Select and verify pinned Skopeo runtime
        run: |
          set -euo pipefail
          runner=scripts/ci/run_pinned_skopeo.py
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            runner=tmp/recovery-controls/scripts/ci/run_pinned_skopeo.py
          fi
          test -f "$runner"
          test ! -L "$runner"
          python "$runner" -- --version
          printf 'TYPE_BRIDGE_SKOPEO_RUNNER=%s\n' "$runner" >> "$GITHUB_ENV"

      - name: Authenticate GHCR
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Revalidate immutable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.release-tag-preflight.outputs.tag_object }}
        run: |
          set -euo pipefail
          tag_ref_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_ref_json")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          test "$tag_object" = "$EXPECTED_RELEASE_TAG_OBJECT"
          tag_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$RELEASE_REVISION"

      - name: Publish exact accepted platform manifests
        run: |
          set -euo pipefail
          image="ghcr.io/ds1sqe/type-bridge-server"
          version="$RELEASE_VERSION"
          for architecture in amd64 arm64; do
            directory="tmp/server-oci/${architecture}"
            (
              cd "$directory"
              sha256sum --check layout.sha256
            )
            archive="$(
              find "$directory" -maxdepth 1 -type f \
                -name '*.oci.tar' -print
            )"
            test -n "$archive"
            test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
            expected="$(
              python -c \
                'import json,sys; print(json.load(open(sys.argv[1]))["manifest_digest"])' \
                "$directory/layout-report.json"
            )"
            raw="$RUNNER_TEMP/${architecture}-remote-manifest.json"
            error="$RUNNER_TEMP/${architecture}-remote-manifest.err"
            if python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
              inspect --raw \
              "docker://${image}:${version}-${architecture}" \
              > "$raw" 2> "$error"; then
              actual="sha256:$(sha256sum "$raw" | cut -d' ' -f1)"
              if [[ "$actual" != "$expected" ]]; then
                echo "Refusing to overwrite conflicting immutable OCI tag." >&2
                echo "tag=${version}-${architecture}" >&2
                echo "existing=${actual}" >&2
                echo "accepted=${expected}" >&2
                exit 1
              fi
              echo "${version}-${architecture} already has the accepted digest; skipping."
            else
              if ! grep -Eiq \
                'manifest unknown|name unknown|status code: 404|status=404|HTTP 404' \
                "$error"; then
                cat "$error" >&2
                exit 1
              fi
              python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
                copy --preserve-digests \
                "oci-archive:${archive}" \
                "docker://${image}:${version}-${architecture}"
              python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
                inspect --raw \
                "docker://${image}:${version}-${architecture}" > "$raw"
            fi
            actual="sha256:$(sha256sum "$raw" | cut -d' ' -f1)"
            test "$actual" = "$expected"
            printf 'SERVER_OCI_%s_DIGEST=%s\n' \
              "${architecture^^}" "$actual" >> "$GITHUB_ENV"
          done

      - name: Create exact stable manifest and aliases
        run: |
          set -euo pipefail
          image="ghcr.io/ds1sqe/type-bridge-server"
          version="$RELEASE_VERSION"
          stable_raw="$RUNNER_TEMP/stable-manifest.json"
          stable_error="$RUNNER_TEMP/stable-manifest.err"
          if python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
            inspect --raw "docker://${image}:${version}" \
            > "$stable_raw" 2> "$stable_error"; then
            echo "${version} already exists; validating before reuse."
          else
            if ! grep -Eiq \
              'manifest unknown|name unknown|status code: 404|status=404|HTTP 404' \
              "$stable_error"; then
              cat "$stable_error" >&2
              exit 1
            fi
            docker buildx imagetools create \
              --tag "${image}:${version}" \
              "${image}@${SERVER_OCI_AMD64_DIGEST}" \
              "${image}@${SERVER_OCI_ARM64_DIGEST}"
            python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
              inspect --raw "docker://${image}:${version}" > "$stable_raw"
          fi
          python - "$stable_raw" \
            "$SERVER_OCI_AMD64_DIGEST" "$SERVER_OCI_ARM64_DIGEST" <<'PY'
          import json
          import sys

          path, amd64, arm64 = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          descriptors = payload.get("manifests")
          if not isinstance(descriptors, list):
              raise SystemExit("Stable OCI tag is not a multi-platform index")
          actual = {}
          for descriptor in descriptors:
              platform = descriptor.get("platform")
              if not isinstance(platform, dict):
                  raise SystemExit("Stable OCI descriptor has no platform")
              key = (platform.get("os"), platform.get("architecture"))
              if key in actual:
                  raise SystemExit(f"Stable OCI index repeats platform {key!r}")
              actual[key] = descriptor.get("digest")
          expected = {
              ("linux", "amd64"): amd64,
              ("linux", "arm64"): arm64,
          }
          if actual != expected:
              raise SystemExit(
                  f"Stable OCI index conflicts with accepted platforms: "
                  f"actual={actual!r}, expected={expected!r}"
              )
          PY
          digest="sha256:$(sha256sum "$stable_raw" | cut -d' ' -f1)"
          for alias in "$SERVER_OCI_MINOR_ALIAS" 2 latest; do
            alias_raw="$RUNNER_TEMP/alias-${alias}.json"
            alias_error="$RUNNER_TEMP/alias-${alias}.err"
            if python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
              inspect --raw "docker://${image}:${alias}" \
              > "$alias_raw" 2> "$alias_error"; then
              alias_digest="sha256:$(sha256sum "$alias_raw" | cut -d' ' -f1)"
              if [[ "$alias_digest" != "$digest" ]]; then
                if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
                  echo "Refusing to move conflicting OCI alias during recovery." >&2
                  echo "alias=${alias}" >&2
                  echo "existing=${alias_digest}" >&2
                  echo "accepted=${digest}" >&2
                  exit 1
                fi
                docker buildx imagetools create \
                  --tag "${image}:${alias}" "${image}@${digest}"
                python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
                  inspect --raw "docker://${image}:${alias}" > "$alias_raw"
              fi
            else
              if ! grep -Eiq \
                'manifest unknown|name unknown|status code: 404|status=404|HTTP 404' \
                "$alias_error"; then
                cat "$alias_error" >&2
                exit 1
              fi
              docker buildx imagetools create \
                --tag "${image}:${alias}" "${image}@${digest}"
              python "$TYPE_BRIDGE_SKOPEO_RUNNER" --registry-auth -- \
                inspect --raw "docker://${image}:${alias}" > "$alias_raw"
            fi
            test "sha256:$(sha256sum "$alias_raw" | cut -d' ' -f1)" = "$digest"
          done
          printf 'SERVER_OCI_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'SERVER_OCI_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Sign exact platform and multi-platform digests
        env:
          COSIGN_CERTIFICATE_IDENTITY_REGEXP: ${{ github.event_name == 'workflow_dispatch' && '^https://github.com/ds1sqe/type-bridge/.github/workflows/release.yml@refs/heads/master$' || '^https://github.com/ds1sqe/type-bridge/.github/workflows/release.yml@refs/tags/v2[.]1[.]0$' }}
        run: |
          cosign sign --yes \
            "${SERVER_OCI_IMAGE}@${SERVER_OCI_AMD64_DIGEST}" \
            "${SERVER_OCI_IMAGE}@${SERVER_OCI_ARM64_DIGEST}" \
            "${SERVER_OCI_IMAGE}@${SERVER_OCI_DIGEST}"
          for digest in \
            "$SERVER_OCI_AMD64_DIGEST" \
            "$SERVER_OCI_ARM64_DIGEST" \
            "$SERVER_OCI_DIGEST"; do
            cosign verify \
              --certificate-identity-regexp \
                "$COSIGN_CERTIFICATE_IDENTITY_REGEXP" \
              --certificate-oidc-issuer \
                https://token.actions.githubusercontent.com \
              "${SERVER_OCI_IMAGE}@${digest}" >/dev/null
          done

      - name: Attest amd64 build provenance
        if: github.event_name == 'push'
        id: attest-provenance-amd64
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_AMD64_DIGEST }}
          push-to-registry: true

      - name: Attest arm64 build provenance
        if: github.event_name == 'push'
        id: attest-provenance-arm64
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_ARM64_DIGEST }}
          push-to-registry: true

      - name: Attest multi-platform provenance
        if: github.event_name == 'push'
        id: attest-provenance-index
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_DIGEST }}
          push-to-registry: true

      - name: Record recovery promotion predicate
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p tmp/server-oci-release
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path(
              "tmp/recovery-controls/.github/release/v2.0.0-recovery.json"
          )
          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes)
          accepted_names = (
              "server-oci-accepted-amd64",
              "server-oci-accepted-arm64",
          )
          accepted = {
              artifact["name"]: {
                  "artifact_id": artifact["id"],
                  "archive_digest": artifact["digest"],
                  "files": artifact["files"],
              }
              for artifact in manifest["artifacts"]
              if artifact["name"] in accepted_names
          }
          if set(accepted) != set(accepted_names):
              raise SystemExit("Recovery predicate is missing an accepted OCI artifact")
          canonical_manifest = json.dumps(
              manifest,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          ledger_sha256 = hashlib.sha256(canonical_manifest).hexdigest()
          if ledger_sha256 != os.environ["RELEASE_RECOVERY_MANIFEST_SHA256"]:
              raise SystemExit("Recovery predicate ledger SHA-256 mismatch")
          predicate = {
              "schema_version": 1,
              "release": {
                  "tag": os.environ["RELEASE_TAG"],
                  "annotated_tag_object": (
                      "a4cec6478ad4e764f039e51eabcbb68d45efd45a"
                  ),
                  "source_revision": os.environ["RELEASE_REVISION"],
                  "source_run_id": manifest["run"]["id"],
                  "source_run_attempt": manifest["run"]["run_attempt"],
                  "source_workflow": manifest["run"]["workflow"],
                  "artifact_ledger_sha256": ledger_sha256,
              },
              "accepted_artifacts": accepted,
              "published_subjects": {
                  "linux/amd64": os.environ["SERVER_OCI_AMD64_DIGEST"],
                  "linux/arm64": os.environ["SERVER_OCI_ARM64_DIGEST"],
                  "multi-platform": os.environ["SERVER_OCI_DIGEST"],
              },
              "promotion": {
                  "control_revision": os.environ["GITHUB_SHA"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              },
          }
          output = Path("tmp/server-oci-release/recovery-promotion.json")
          output.write_text(json.dumps(predicate, indent=2, sort_keys=True) + "\n")
          PY

      - name: Attest amd64 recovery promotion
        if: github.event_name == 'workflow_dispatch'
        id: attest-promotion-amd64
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # v3.2.0
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_AMD64_DIGEST }}
          predicate-type: https://github.com/ds1sqe/type-bridge/attestations/release-promotion/v1
          predicate-path: tmp/server-oci-release/recovery-promotion.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 recovery promotion
        if: github.event_name == 'workflow_dispatch'
        id: attest-promotion-arm64
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # v3.2.0
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_ARM64_DIGEST }}
          predicate-type: https://github.com/ds1sqe/type-bridge/attestations/release-promotion/v1
          predicate-path: tmp/server-oci-release/recovery-promotion.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest multi-platform recovery promotion
        if: github.event_name == 'workflow_dispatch'
        id: attest-promotion-index
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # v3.2.0
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_DIGEST }}
          predicate-type: https://github.com/ds1sqe/type-bridge/attestations/release-promotion/v1
          predicate-path: tmp/server-oci-release/recovery-promotion.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest amd64 SPDX SBOM
        id: attest-sbom-amd64
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_AMD64_DIGEST }}
          sbom-path: tmp/server-oci/amd64/server.spdx.json
          push-to-registry: true

      - name: Attest arm64 SPDX SBOM
        id: attest-sbom-arm64
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.SERVER_OCI_IMAGE }}
          subject-digest: ${{ env.SERVER_OCI_ARM64_DIGEST }}
          sbom-path: tmp/server-oci/arm64/server.spdx.json
          push-to-registry: true

      - name: Record immutable OCI release identity
        env:
          PROVENANCE_AMD64_URL: ${{ steps.attest-provenance-amd64.outputs.attestation-url }}
          PROVENANCE_ARM64_URL: ${{ steps.attest-provenance-arm64.outputs.attestation-url }}
          PROVENANCE_INDEX_URL: ${{ steps.attest-provenance-index.outputs.attestation-url }}
          PROMOTION_AMD64_URL: ${{ steps.attest-promotion-amd64.outputs.attestation-url }}
          PROMOTION_ARM64_URL: ${{ steps.attest-promotion-arm64.outputs.attestation-url }}
          PROMOTION_INDEX_URL: ${{ steps.attest-promotion-index.outputs.attestation-url }}
          SBOM_AMD64_URL: ${{ steps.attest-sbom-amd64.outputs.attestation-url }}
          SBOM_ARM64_URL: ${{ steps.attest-sbom-arm64.outputs.attestation-url }}
        run: |
          mkdir -p tmp/server-oci-release
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          attestation_urls = {
              "build_provenance_amd64": os.environ["PROVENANCE_AMD64_URL"],
              "build_provenance_arm64": os.environ["PROVENANCE_ARM64_URL"],
              "build_provenance_index": os.environ["PROVENANCE_INDEX_URL"],
              "recovery_promotion_amd64": os.environ["PROMOTION_AMD64_URL"],
              "recovery_promotion_arm64": os.environ["PROMOTION_ARM64_URL"],
              "recovery_promotion_index": os.environ["PROMOTION_INDEX_URL"],
              "sbom_amd64": os.environ["SBOM_AMD64_URL"],
              "sbom_arm64": os.environ["SBOM_ARM64_URL"],
          }
          payload = {
              "image": os.environ["SERVER_OCI_IMAGE"],
              "digest": os.environ["SERVER_OCI_DIGEST"],
              "platform_digests": {
                  "linux/amd64": os.environ["SERVER_OCI_AMD64_DIGEST"],
                  "linux/arm64": os.environ["SERVER_OCI_ARM64_DIGEST"],
              },
              "revision": os.environ["RELEASE_REVISION"],
              "tag": os.environ["RELEASE_TAG"],
              "aliases": [os.environ["SERVER_OCI_MINOR_ALIAS"], "2", "latest"],
              "attestations": {
                  name: url for name, url in attestation_urls.items() if url
              },
          }
          output = Path("tmp/server-oci-release/server-oci-release.json")
          output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          markdown = Path("tmp/server-oci-release/server-oci-release.md")
          alias_markdown = ", ".join(f"`{alias}`" for alias in payload["aliases"])
          markdown.write_text(
              "## TypeBridge server OCI\n\n"
              f"`{payload['image']}@{payload['digest']}`\n\n"
              f"- linux/amd64: `{payload['platform_digests']['linux/amd64']}`\n"
              f"- linux/arm64: `{payload['platform_digests']['linux/arm64']}`\n"
              f"- aliases: {alias_markdown}\n"
          )
          PY

      - name: Upload immutable OCI release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-oci-release-metadata
          path: tmp/server-oci-release
          if-no-files-found: error

  # Publish only the accepted tarball. This is deliberately the first registry
  # mutation because npm has no package-scoped, non-mutating publish probe.
  publish-node-npm:
    name: Publish Node package to npm
    if: >-
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/tags/v2.1.0' &&
          needs.channel-preflight.result == 'success' &&
          needs.release-tag-preflight.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master' &&
          inputs.release_channel == 'recovery' &&
          inputs.recovery_mode == 'publish' &&
          inputs.recovery_run_id == '30612912483' &&
          needs.recovery-preflight.result == 'success' &&
          needs.release-tag-preflight.result == 'success'
        )
      )
    needs: [channel-preflight, recovery-preflight, release-tag-preflight]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
          persist-credentials: false

      - name: Checkout recovery payload controls
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: tmp/recovery-controls
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm publisher
        run: |
          npm install --global --ignore-scripts npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Download accepted npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-package
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RELEASE_ARTIFACT_RUN_ID }}

      - name: Revalidate recovery npm payload
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tmp/recovery-controls/scripts/ci/validate_release_recovery_payloads.py \
            --manifest tmp/recovery-controls/.github/release/v2.0.0-recovery.json \
            --expected-manifest-sha256 "$RELEASE_RECOVERY_MANIFEST_SHA256" \
            --artifact-root dist \
            --artifact node-package

      - name: Revalidate accepted npm identity before publish
        run: |
          mapfile -t packages < <(
            find ./dist -maxdepth 1 -type f -name '*.tgz' -print
          )
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one accepted npm tarball, found %s\n' \
              "${#packages[@]}" >&2
            exit 1
          fi
          python scripts/ci/validate_node_release_package.py \
            --artifact "${packages[0]}" \
            --repository-package type-bridge-core/crates/node/package.json \
            --tag "$RELEASE_TAG"

      - name: Revalidate immutable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.release-tag-preflight.outputs.tag_object }}
        run: |
          set -euo pipefail
          tag_ref_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_ref_json")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          test "$tag_object" = "$EXPECTED_RELEASE_TAG_OBJECT"
          tag_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$RELEASE_REVISION"

      - name: Publish to npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mapfile -t packages < <(
            find ./dist -maxdepth 1 -type f -name '*.tgz' -print
          )
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one accepted npm tarball, found %s\n' \
              "${#packages[@]}" >&2
            exit 1
          fi
          package_name="$(node -p "require('./type-bridge-core/crates/node/package.json').name")"
          package_version="$(node -p "require('./type-bridge-core/crates/node/package.json').version")"
          view_error="$RUNNER_TEMP/npm-view-error.log"
          if registry_integrity="$(
            npm view "${package_name}@${package_version}" dist.integrity \
              2> "$view_error"
          )"; then
            python scripts/ci/validate_node_release_package.py \
              --artifact "${packages[0]}" \
              --repository-package type-bridge-core/crates/node/package.json \
              --tag "$RELEASE_TAG" \
              --registry-integrity "$registry_integrity"
            echo "${package_name}@${package_version} already published with identical bytes; skipping."
          elif grep -Eq 'E404|404 Not Found' "$view_error"; then
            npm publish "${packages[0]}" --access public
          else
            cat "$view_error" >&2
            echo "npm registry lookup failed without an authoritative 404." >&2
            exit 1
          fi

  # Publish type-bridge-core to PyPI (must complete before type-bridge)
  publish-core-pypi:
    name: Publish type-bridge-core to PyPI
    if: >-
      always() &&
      !cancelled() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/tags/v2.1.0' &&
          needs.release-tag-preflight.result == 'success' &&
          needs.build-core-wheels.result == 'success' &&
          needs.build-core-sdist.result == 'success' &&
          needs.publish-server-oci.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/master' &&
          inputs.release_channel == 'recovery' &&
          inputs.recovery_mode == 'publish' &&
          inputs.recovery_run_id == '30612912483' &&
          needs.recovery-preflight.result == 'success' &&
          needs.release-tag-preflight.result == 'success' &&
          needs.publish-server-oci.result == 'success'
        )
      )
    needs: [build-core-wheels, build-core-sdist, recovery-preflight, release-tag-preflight, publish-server-oci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_REVISION }}
          persist-credentials: false

      - name: Checkout recovery payload controls
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: tmp/recovery-controls
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Download core wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-wheels-*
          path: dist/
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RELEASE_ARTIFACT_RUN_ID }}

      - name: Download core sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-sdist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RELEASE_ARTIFACT_RUN_ID }}

      - name: Revalidate recovery core payloads
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tmp/recovery-controls/scripts/ci/validate_release_recovery_payloads.py \
            --manifest tmp/recovery-controls/.github/release/v2.0.0-recovery.json \
            --expected-manifest-sha256 "$RELEASE_RECOVERY_MANIFEST_SHA256" \
            --artifact-root dist \
            --artifact core-wheels-linux-aarch64 \
            --artifact core-wheels-linux-x86_64 \
            --artifact core-wheels-macos-aarch64 \
            --artifact core-wheels-macos-x86_64 \
            --artifact core-wheels-windows-x86_64 \
            --artifact core-sdist

      - name: List artifacts
        run: ls -la dist/

      # The publisher action adds attestation sidecars to dist/. Preserve the
      # exact accepted bytes for both the preflight and post-publish checks.
      - name: Snapshot immutable PyPI candidate
        run: |
          mkdir -p tmp
          cp -a dist tmp/pypi-candidate

      - name: Verify idempotent PyPI hashes
        run: |
          version="$PYTHON_RELEASE_VERSION"
          python scripts/ci/verify_pypi_release_hashes.py \
            --project type-bridge-core \
            --version "$version" \
            --dist-dir tmp/pypi-candidate

      - name: Revalidate immutable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.release-tag-preflight.outputs.tag_object }}
        run: |
          set -euo pipefail
          tag_ref_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_ref_json")" = tag
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          test "$tag_object" = "$EXPECTED_RELEASE_TAG_OBJECT"
          tag_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          )"
          test "$(jq -r '.object.type' <<<"$tag_json")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_json")" = "$RELEASE_REVISION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true

      - name: Verify published PyPI hashes
        run: |
          version="$PYTHON_RELEASE_VERSION"
          python scripts/ci/verify_pypi_release_hashes.py \
            --project type-bridge-core \
            --version "$version" \
            --dist-dir tmp/pypi-candidate \
            --require-existing \
            --attempts 6 \
            --retry-delay-seconds 10

  # Publish type-bridge to PyPI (after core is available)
  publish-python-pypi:
