name: Release

on:
  push:
    tags:
      - 'v*'

# Ensure only one release workflow runs at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Run tests before releasing
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check .

      - name: Run cargo test
        working-directory: type-bridge-core
        run: cargo test --all-targets

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

  # Publish Rust crates to crates.io (dependency order):
  # core-lib → orm-derive → protocol-b7 → driver-b7 → typedb-runtime → orm → server
  publish-crates:
    name: Publish Rust crates to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Create crates.io publish helper
        working-directory: type-bridge-core
        run: |
          cat > "$RUNNER_TEMP/publish-crate.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          crate="$1"
          pkgid="$(cargo pkgid -p "$crate")"
          version="${pkgid##*@}"
          if [ -z "$version" ] || [ "$version" = "$pkgid" ]; then
            echo "Could not resolve version for crate: $crate"
            exit 1
          fi

          api_url="https://crates.io/api/v1/crates/${crate}/${version}"
          status="$(
            curl -sS --retry 3 --retry-delay 2 \
              -H "User-Agent: ds1sqe/type-bridge release workflow" \
              -o "$RUNNER_TEMP/crates-io-response.json" \
              -w "%{http_code}" \
              "$api_url" || true
          )"

          if [ "$status" = "200" ]; then
            echo "${crate}@${version} already published on crates.io; skipping."
            exit 0
          elif [ "$status" != "404" ]; then
            echo "Could not confirm crates.io state for ${crate}@${version} (HTTP ${status}); attempting publish."
          fi

          if ! out="$(cargo publish -p "$crate" 2>&1)"; then
            echo "$out"
            echo "$out" | grep -qiE "already (uploaded|exists|published)|crate .* already exists on crates.io index" \
              || { echo "${crate}@${version} publish failed (not already-published)"; exit 1; }
            echo "${crate}@${version} already published on crates.io; skipping."
          fi
          EOF
          chmod +x "$RUNNER_TEMP/publish-crate.sh"

      - name: Publish type-bridge-core-lib
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/publish-crate.sh type-bridge-core-lib"

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-orm-derive
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/publish-crate.sh type-bridge-orm-derive"

      - name: Wait for crates.io index
        run: sleep 30

      # Band-7 fork pair published before typedb-runtime: Cargo unifies
      # semver-compatible 3.x versions, so the forks are republished under
      # renamed crates; typedb-runtime resolves them from crates.io via
      # `version = "=3.8.1"`.
      # Order: core-lib → orm-derive → protocol-b7 → driver-b7 →
      # typedb-runtime → orm → server.
      - name: Publish type-bridge-typedb-protocol-b7
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/publish-crate.sh type-bridge-typedb-protocol-b7"

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-typedb-driver-b7
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/publish-crate.sh type-bridge-typedb-driver-b7"

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-typedb-runtime
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/publish-crate.sh type-bridge-typedb-runtime"

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-orm
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/publish-crate.sh type-bridge-orm"

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish type-bridge-server
        working-directory: type-bridge-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: "$RUNNER_TEMP/publish-crate.sh type-bridge-server"

  # Build type-bridge-core wheels for all platforms
  build-core-wheels:
    name: Build core wheel (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: core-wheels-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: core-wheels-linux-aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: core-wheels-macos-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: core-wheels-macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: core-wheels-windows-x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (Linux aarch64 cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          # The manylinux aarch64 cross-compiler does not define the ARM ACLE
          # macro __ARM_ARCH that ring's pregenerated assembly requires. The
          # variable name is target-suffixed, so it only affects the aarch64
          # Linux wheel even though it is declared on every matrix leg.
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '-D__ARM_ARCH=8' || '' }}
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.13
          manylinux: auto
          working-directory: type-bridge-core

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: type-bridge-core/dist/*.whl

  # Build type-bridge-core sdist (fallback for exotic platforms)
  build-core-sdist:
    name: Build core sdist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          working-directory: type-bridge-core

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-sdist
          path: type-bridge-core/dist/*.tar.gz

  # Build pure-Python type-bridge package
  build-python:
    name: Build type-bridge
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # Build and pack the @type-bridge/node binding for the GitHub Release. The
  # registry publish is staged but stays inert until an NPM_TOKEN secret exists,
  # so tagging a release never fails for a missing token.
  build-node:
    name: Build Node binding package
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: type-bridge-core/crates/node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: type-bridge-core/crates/node/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install Node dependencies
        run: npm ci

      - name: Build native module and TypeScript surface
        run: npm run build

      - name: Pack npm tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload npm tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-package
          path: type-bridge-core/crates/node/dist/*.tgz

      # secrets are unavailable in step `if:` conditions, so detect the token in a
      # step (via env, never echoed) and gate the publish on this step's output.
      - name: Detect npm token
        id: npm_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No NPM_TOKEN secret; skipping the npm registry publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm registry
        if: steps.npm_token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already published; skipping."
          else
            npm publish --access public
          fi

  # Publish type-bridge-core to PyPI (must complete before type-bridge)
  publish-core-pypi:
    name: Publish type-bridge-core to PyPI
    needs: [build-core-wheels, build-core-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download core wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: core-wheels-*
          path: dist/
          merge-multiple: true

      - name: Download core sdist
        uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true

  # Publish type-bridge to PyPI (after core is available)
  publish-python-pypi:
    name: Publish type-bridge to PyPI
    needs: [build-python, publish-core-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true

  # Create draft GitHub Release with all artifacts
  github-release:
    name: Create GitHub Release
    needs: [publish-python-pypi, publish-crates, build-node]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download core wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: core-wheels-*
          path: dist/
          merge-multiple: true

      - name: Download core sdist
        uses: actions/download-artifact@v4
        with:
          name: core-sdist
          path: dist/

      - name: Download Python build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Download Node package artifact
        uses: actions/download-artifact@v4
        with:
          name: node-package
          path: dist/

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
