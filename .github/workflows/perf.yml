name: Perf

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      data_branch:
        description: Branch that stores perf history
        required: false
        default: perf-data
        type: string

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every other run gets
# a group of its own: GitHub keeps one pending run per group and cancels the
# rest, which would drop their results.
concurrency:
  group: perf-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_HOME: ${{ github.workspace }}/../.cargo-home
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_STABLE_TOOLCHAIN: "1.94.1"
  # Must equal the exact gungraun dev-dependency of the core and ORM crates.
  GUNGRAUN_RUNNER_VERSION: "0.20.0"
  GUNGRAUN_RUNNER_ROOT: ${{ github.workspace }}/../.gungraun-runner
  PERF_DIR: ${{ github.workspace }}/perf-out

jobs:
  metadata:
    name: Shared run identity
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.clock.outputs.started_at }}
    steps:
      - name: Record workflow start
        id: clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  micro:
    needs: metadata
    name: Micro and Python binding benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PERF_STARTED_AT: ${{ needs.metadata.outputs.started_at }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y valgrind
          valgrind --version

      - name: Cache gungraun-runner
        id: gungraun-runner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.GUNGRAUN_RUNNER_ROOT }}
          key: ${{ runner.os }}-gungraun-runner-${{ env.GUNGRAUN_RUNNER_VERSION }}-rust-${{ env.RUST_STABLE_TOOLCHAIN }}

      - name: Install gungraun-runner
        if: steps.gungraun-runner.outputs.cache-hit != 'true'
        run: |
          cargo install gungraun-runner --version "$GUNGRAUN_RUNNER_VERSION" --locked \
            --root "$GUNGRAUN_RUNNER_ROOT"

      - name: Put gungraun-runner on PATH
        run: |
          echo "$GUNGRAUN_RUNNER_ROOT/bin" >> "$GITHUB_PATH"
          test -x "$GUNGRAUN_RUNNER_ROOT/bin/gungraun-runner"

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            type-bridge-core/target
          key: ${{ runner.os }}-cargo-perf-v1-${{ hashFiles('type-bridge-core/Cargo.lock') }}

      # Each crate writes into its own directory, which names the crate in
      # the metric ids. New bench targets must be added to these lists.
      - name: Criterion wall time
        working-directory: type-bridge-core
        run: |
          CRITERION_HOME="$PERF_DIR/criterion/core" cargo bench --locked -p type-bridge-core-lib \
            --bench validation --bench compilation --bench schema -- --noplot
          CRITERION_HOME="$PERF_DIR/criterion/orm" cargo bench --locked -p type-bridge-orm \
            --bench serde --bench query_building -- --noplot

      - name: Instruction counts
        working-directory: type-bridge-core
        env:
          GUNGRAUN_SAVE_SUMMARY: json
        run: |
          GUNGRAUN_HOME="$PERF_DIR/iai/core" cargo bench --locked -p type-bridge-core-lib \
            --bench validation_iai --bench compilation_iai --bench schema_iai
          GUNGRAUN_HOME="$PERF_DIR/iai/orm" cargo bench --locked -p type-bridge-orm \
            --bench serde_iai --bench query_building_iai

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      # uv builds the native module through maturin's PEP 517 backend, which
      # uses the release profile, as the published wheel does.
      - name: Install the Python package
        run: uv sync --extra dev

      - name: Python binding benchmarks
        run: >-
          uv run pytest benchmarks --benchmark-only -q -p no:cacheprovider
          --benchmark-json "$PERF_DIR/pytest-benchmark.json"

      - name: Convert to a perf result
        run: >-
          python -m perf.harness.micro
          --criterion-dir "$PERF_DIR/criterion"
          --iai-dir "$PERF_DIR/iai"
          --pytest-benchmark "$PERF_DIR/pytest-benchmark.json"
          --started-at "$PERF_STARTED_AT"
          --out "$PERF_DIR/micro.json"

      - name: Validate the perf result
        run: python -m perf.harness.validate "$PERF_DIR/micro.json"

      - name: Upload the perf result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-micro
          path: perf-out/micro.json
          if-no-files-found: error

  build:
    needs: metadata
    name: Cold release build times
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PERF_STARTED_AT: ${{ needs.metadata.outputs.started_at }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install wheel builder
        run: |
          uv tool install maturin==1.14.1
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      # Only the registry is reusable: each group creates an absent target.
      - name: Measure cold release builds
        run: >-
          python -m perf.harness.build
          --target-dir "$GITHUB_WORKSPACE/tmp/perf-cold-build"
          --out "$PERF_DIR/build.json"
      - name: Upload build metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-build
          path: perf-out/build.json
          if-no-files-found: error

  size:
    needs: metadata
    name: Linux x86_64 artifact sizes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PERF_STARTED_AT: ${{ needs.metadata.outputs.started_at }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Build Linux wheel as in release
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.14.1
          rust-toolchain: "1.94.1"
          target: x86_64-unknown-linux-gnu
          args: --release --out dist -i python3.13
          manylinux: auto
          working-directory: type-bridge-core
      # maturin's manylinux container leaves type-bridge-core/target owned by
      # root; hand it back so the host Node and cargo builds can use it.
      - name: Reclaim the Rust target directory
        run: sudo chown -R "$(id -u):$(id -g)" type-bridge-core/target
      - name: Pack Linux npm package
        working-directory: type-bridge-core/crates/node
        run: |
          npm ci
          npm run build
          mkdir -p "$PERF_DIR/packages"
          npm pack --ignore-scripts --pack-destination "$PERF_DIR/packages"
      - name: Build unstripped CLI and release server binary
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/type-bridge-core/target
        run: |
          cargo build --locked --release --manifest-path type-bridge-core/Cargo.toml \
            -p type-bridge-cli --bin type-bridge
          cp "$CARGO_TARGET_DIR/release/type-bridge" "$PERF_DIR/cli-unstripped"
          cargo build --locked --release --manifest-path type-bridge-core/Cargo.toml \
            -p type-bridge-server --no-default-features --features band8,band9,v2-query
          strip -o "$PERF_DIR/server" "$CARGO_TARGET_DIR/release/type-bridge-server"
      - name: Build canonical stripped CLI
        run: >-
          python scripts/ci/standalone_cli_artifact.py build
          --output "$GITHUB_WORKSPACE/tmp/perf-cli"
      # The release C helper remains frozen to 1.6 until 2.3 release prep.
      - name: Archive current CMake runtime install with release Cargo flags
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          from standalone_cli_artifact import artifact_build_environment
          root = Path.cwd()
          target = root / "tmp/perf-c-build"
          prefix = root / "tmp/perf-c-install"
          environment = artifact_build_environment(target)
          subprocess.run(["cargo", "build", "--locked", "--release", "--target",
              "x86_64-unknown-linux-gnu", "--manifest-path", "type-bridge-core/Cargo.toml",
              "-p", "type-bridge-c", "--lib"], env=environment, check=True)
          library = target / "x86_64-unknown-linux-gnu/release/libtype_bridge_c.so"
          subprocess.run(["cmake", "-S", "type-bridge-core/crates/c", "-B", "tmp/perf-c-cmake",
              f"-DTYPE_BRIDGE_C_LIBRARY={library}", f"-DCMAKE_INSTALL_PREFIX={prefix}",
              "-DCMAKE_INSTALL_LIBDIR=lib"], check=True)
          subprocess.run(["cmake", "--install", "tmp/perf-c-cmake"], check=True)
          subprocess.run(["tar", "--sort=name", "--mtime=@0", "--owner=0", "--group=0",
              "--numeric-owner", "-C", str(prefix), "-czf",
              os.environ["PERF_DIR"] + "/c-runtime.tar.gz", "."], check=True)
          PY
      - name: Measure release artifacts
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          out = Path(os.environ["PERF_DIR"])
          def single(pattern):
              matches = list(Path.cwd().glob(pattern))
              if len(matches) != 1:
                  raise ValueError(f"expected one {pattern}, got {matches}")
              return matches[0]
          artifacts = {
              "wheel": single("type-bridge-core/dist/*.whl"),
              "npm": single("perf-out/packages/*.tgz"),
              "cli_unstripped": out / "cli-unstripped",
              "cli_stripped": Path("tmp/perf-cli/build/x86_64-unknown-linux-gnu/release/type-bridge"),
              "server": out / "server",
              "c_runtime": out / "c-runtime.tar.gz",
              "c_runtime_lib": Path("tmp/perf-c-install/lib/libtype_bridge_c.so"),
          }
          command = [sys.executable, "-m", "perf.harness.size", "--out", str(out / "size.json")]
          for name, path in artifacts.items():
              command += ["--artifact", f"{name}={path}"]
          subprocess.run(command, check=True)
          PY
      - name: Upload size metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-size
          path: perf-out/size.json
          if-no-files-found: error

  suite:
    needs: metadata
    name: Offline test-suite durations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PERF_STARTED_AT: ${{ needs.metadata.outputs.started_at }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/type-bridge-core/target
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Prepare native test dependencies outside suite timing
        run: |
          uv sync --extra dev
          npm ci --prefix type-bridge-core/crates/node
          npm run build --prefix type-bridge-core/crates/node
          cargo fetch --locked --manifest-path type-bridge-core/Cargo.toml
      - name: Measure existing offline suites
        run: uv run python -m perf.harness.suite --out "$PERF_DIR/suite.json"
      - name: Upload suite metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-suite
          path: perf-out/suite.json
          if-no-files-found: error

  compare:
    name: Base versus head micro benchmarks
    if: github.event_name == 'pull_request'
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PERF_STARTED_AT: ${{ needs.metadata.outputs.started_at }}
    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Checkout head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Check for a base harness
        id: harness
        run: |
          if [ -f base/perf/harness/micro.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Base predates the perf micro harness; comparison skipped"
            echo "Base predates the perf micro harness; comparison skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Python
        if: steps.harness.outputs.available == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Install Rust toolchain
        if: steps.harness.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_STABLE_TOOLCHAIN }}
      - name: Install instruction-count tools
        if: steps.harness.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y valgrind
          cargo install gungraun-runner --version "$GUNGRAUN_RUNNER_VERSION" --locked \
            --root "$GUNGRAUN_RUNNER_ROOT"
          echo "$GUNGRAUN_RUNNER_ROOT/bin" >> "$GITHUB_PATH"
      - name: Measure both revisions on this runner
        if: steps.harness.outputs.available == 'true'
        env:
          GUNGRAUN_SAVE_SUMMARY: json
        run: |
          mkdir -p "$PERF_DIR"
          for side in base head; do
            (
              cd "$GITHUB_WORKSPACE/$side"
              export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/tmp/compare-$side"
              export GITHUB_SHA
              GITHUB_SHA=$(git rev-parse HEAD)
              export GITHUB_HEAD_REF="$side"
              for spec in 'core:type-bridge-core-lib:validation compilation schema' 'orm:type-bridge-orm:serde query_building'; do
                IFS=: read -r group package benches <<< "$spec"
                wall=()
                instructions=()
                for bench in $benches; do
                  wall+=(--bench "$bench")
                  instructions+=(--bench "${bench}_iai")
                done
                CRITERION_HOME="$PERF_DIR/$side/criterion/$group" \
                  cargo bench --locked --manifest-path type-bridge-core/Cargo.toml \
                  -p "$package" "${wall[@]}" -- --noplot
                GUNGRAUN_HOME="$PERF_DIR/$side/iai/$group" \
                  cargo bench --locked --manifest-path type-bridge-core/Cargo.toml \
                  -p "$package" "${instructions[@]}"
              done
              python -m perf.harness.micro --criterion-dir "$PERF_DIR/$side/criterion" \
                --iai-dir "$PERF_DIR/$side/iai" --started-at "$PERF_STARTED_AT" \
                --out "$PERF_DIR/$side.json"
            )
          done
      - name: Write advisory comparison
        if: steps.harness.outputs.available == 'true'
        working-directory: head
        run: |
          python -m perf.harness.compare "$PERF_DIR/base.json" "$PERF_DIR/head.json" \
            --out "$PERF_DIR/comparison.md"
          cat "$PERF_DIR/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison evidence
        if: steps.harness.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-perf-comparison
          path: |
            perf-out/base.json
            perf-out/head.json
            perf-out/comparison.md
          if-no-files-found: error

  # Appends this run's results to the history branch. Runs only for master
  # pushes, the nightly schedule and manual dispatch, never for pull
  # requests; it is the only job with write access, and it writes only the
  # data branch. It has no concurrency group: GitHub keeps one pending job
  # per group and cancels the rest, which would drop their results.
  # Concurrent stores are serialized by the push retry below instead.
  store:
    name: Store perf history
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    needs: [micro, build, size, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DATA_BRANCH: ${{ inputs.data_branch || 'perf-data' }}
      DATA_DIR: ${{ github.workspace }}/perf-data
      RESULTS_DIR: ${{ github.workspace }}/perf-results
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Download the perf results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: perf-*
          path: perf-results
          merge-multiple: true

      - name: Validate the perf results
        run: python -m perf.harness.validate "$RESULTS_DIR"/*.json

      # A worktree of the code checkout shares its fetch credentials. The
      # branch is created as an orphan on the first run.
      - name: Check out the data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" "$DATA_DIR" "origin/$DATA_BRANCH"
          else
            echo "Creating $DATA_BRANCH as an orphan branch"
            git worktree add --detach "$DATA_DIR"
            git -C "$DATA_DIR" switch --orphan "$DATA_BRANCH"
          fi

      # index.json changes on every store, so a rejected push is never
      # rebased: the store is idempotent and is redone on the new tip. The
      # randomized delay keeps concurrent store jobs from retrying in step.
      - name: Store and push
        run: |
          attempts=10
          # Exits the step successfully when there is nothing new to push.
          store_and_commit() {
            python -m perf.harness.store --data-dir "$DATA_DIR" "$RESULTS_DIR"/*.json
            git -C "$DATA_DIR" add runs index.json
            if git -C "$DATA_DIR" diff --cached --quiet; then
              echo "Nothing new to store"
              exit 0
            fi
            git -C "$DATA_DIR" commit --quiet \
              -m "perf: store ${GITHUB_SHA::12} (${GITHUB_EVENT_NAME})"
          }
          store_and_commit
          for attempt in $(seq 1 "$attempts"); do
            if git -C "$DATA_DIR" push origin "HEAD:refs/heads/$DATA_BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              break
            fi
            delay=$((RANDOM % 5 + 1))
            echo "Push rejected (attempt $attempt of $attempts); storing again on the new tip in ${delay}s"
            sleep "$delay"
            git -C "$DATA_DIR" fetch --no-tags --depth=1 origin \
              "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git -C "$DATA_DIR" reset --hard --quiet "origin/$DATA_BRANCH"
            store_and_commit
          done
          echo "::error::could not push $DATA_BRANCH after $attempts attempts; these results are not stored"
          exit 1
