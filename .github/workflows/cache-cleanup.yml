name: Cache cleanup

# CI writes caches only from master and restores the newest by prefix. This
# removes what no run can use: older master entries of a family, caches of a
# closed pull request, and caches of refs that are gone or idle. See
# scripts/ci/cache_cleanup.py.
on:
  # The base-branch context gives a token that can delete caches; nothing
  # from the pull request is checked out or run.
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete unusable caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - name: Delete caches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            pull_request_target) mode=(--mode pr --pr "$PR") ;;
            workflow_run) mode=(--mode master) ;;
            *) mode=(--mode sweep) ;;
          esac
          python scripts/ci/cache_cleanup.py --repo "$GITHUB_REPOSITORY" "${mode[@]}"
