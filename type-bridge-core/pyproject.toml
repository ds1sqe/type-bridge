[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "type-bridge-core"
version = "1.5.8"
description = "Rust core for type-bridge ORM"
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "type_bridge_core"
python-source = "python"
include = [
    # Cargo metadata resolves optional path dependencies even when their feature
    # is disabled. Maturin 1.14 no longer discovers this crate automatically.
    { path = "crates/orm-derive/**/*", format = "sdist" },
]
exclude = [
    "python/**/__pycache__/**",
    "python/**/*.pyc",
    "python/**/*.pyo",
]
