[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "type-bridge-core"
version = "2.0.0"
description = "Shared Rust semantic engine for the TypeBridge application toolkit"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "type_bridge_core"
python-source = "python"
include = [
    # PEP 639 metadata names this root file; include it explicitly because
    # Maturin otherwise only copies Cargo's per-crate license projections.
    { path = "LICENSE", format = "sdist" },
    # Cargo metadata resolves optional path dependencies even when their feature
    # is disabled. Maturin 1.14 no longer discovers this crate automatically.
    { path = "crates/orm-derive/**/*", format = "sdist" },
]
exclude = [
    "python/**/__pycache__/**",
    "python/**/*.pyc",
    "python/**/*.pyo",
]
