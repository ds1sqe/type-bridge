[package]
name = "type-bridge-core"
version = "0.1.0-dev.0"
edition = "2024"

[lib]
name = "type_bridge_core"
crate-type = ["cdylib", "rlib"]

[dependencies]

pyo3 = { version = "0.23", features = ["extension-module"] }

serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"

once_cell = "1.19"

unicode-ident = "1.0"
pythonize = "0.23"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "compilation"
harness = false
