[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/migration",
    "crates/python",
    "crates/server",
    "crates/orm",
    "crates/orm-derive",
    "crates/node",
    "crates/toml-transpiler",
]

[workspace.package]
license = "MIT"
repository = "https://github.com/ds1sqe/type-bridge"
authors = ["ds1sqe"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(coverage)'] }
