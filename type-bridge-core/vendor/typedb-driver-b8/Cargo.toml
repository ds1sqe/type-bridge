[package]
name = "type-bridge-typedb-driver-b8"
version = "3.11.5"
edition = "2024"
license = "Apache-2.0"
license-file = "LICENSE"
description = "Renamed package of upstream typedb-driver 3.11.5 (TypeDB protocol band 8); source-unmodified compatibility package authorized for TypeBridge Cargo distribution"
readme = "README.md"
repository = "https://github.com/ds1sqe/type-bridge"
homepage = "https://github.com/typedb/typedb-driver"

[features]
sync = []

# Vendored upstream source compiled under this workspace's toolchain trips
# style lints upstream's own build system never surfaced; allow them at the
# manifest level rather than edit vendored source (see vendor/README.md).
[lints.rust]
unused = "allow"
dead_code = "allow"
private_interfaces = "allow"

[lints.clippy]
all = "allow"

[lib]
path = "src/lib.rs"
# Upstream's doc examples are illustrative snippets that were never compiled
# (upstream builds with Bazel, no doctest step); they do not build as Rust
# doctests, so the doctest target is disabled rather than editing src/.
doctest = false

[dependencies]
# Repointed at the renamed vendored protocol; the dependency alias preserves
# the upstream in-source `typedb_protocol` crate name.
typedb-protocol = { package = "type-bridge-typedb-protocol-b8", path = "../typedb-protocol-b8", version = "=3.11.0" }
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "signal"] }
tracing = "0.1.37"
serde = { version = "1.0.228", features = ["rc"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
tokio-stream = "0.1.11"
futures = { version = "0.3.30", features = ["executor", "thread-pool"] }
itertools = "0.14.0"
uuid = { version = "1.1.2", features = ["fast-rng", "v4"] }
prost = "0.13"
chrono-tz = { version = "0.9.0", features = ["case-insensitive"] }
tonic-types = "0.12"
http = "1.1.0"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
maybe-async = "0.2.7"
chrono = "0.4.44"
crossbeam = "0.8.2"

# Upstream's generated manifest omits dev-dependencies, so the published
# crate cannot compile its own #[cfg(test)] code (answer/json.rs tests use
# rand's pre-0.9 distributions/thread_rng API); restored here.
[dev-dependencies]
rand = "0.8"
serde_json = "1"
