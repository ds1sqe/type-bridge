[package]
name = "type-bridge-typedb-protocol-b8"
version = "3.11.0"
edition = "2024"
license = "MPL-2.0"
license-file = "LICENSE"
description = "Renamed vendor of upstream typedb-protocol 3.11.0 (TypeDB protocol band 8); source-unmodified compatibility package with registry publication gated by separate explicit TypeBridge owner authorization"
readme = "README.md"
repository = "https://github.com/ds1sqe/type-bridge"
homepage = "https://github.com/typedb/typedb-protocol"

# Generated upstream protocol source is retained byte-for-byte. Keep lint
# accommodation in the manifest rather than modifying generated code.
[lints.rust]
unused = "allow"
dead_code = "allow"

[lints.clippy]
all = "allow"

[lib]
path = "src/typedb.protocol.rs"
doctest = false

[dependencies]
prost = "=0.13.5"
tonic = "=0.12.3"
