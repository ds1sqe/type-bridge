[package]
name = "type-bridge-typedb-driver-b7"
version = "3.8.1"
edition = "2021"
license = "Apache-2.0"
description = "Renamed vendor of upstream typedb-driver 3.8.1 (TypeDB protocol band 7), republished unmodified for type-bridge dual-band server support"
readme = "README.md"
repository = "https://github.com/ds1sqe/type-bridge"
homepage = "https://github.com/typedb/typedb-driver"

[features]
sync = []

# Vendored upstream source compiled under this workspace's toolchain trips
# style lints upstream's own build system never surfaced; allow them at the
# manifest level rather than edit vendored src/ (see vendor/README.md).
[lints.rust]
unused = "allow"
dead_code = "allow"
private_interfaces = "allow"

[lints.clippy]
all = "allow"

[lib]
path = "src/lib.rs"
# Upstream's doc examples are illustrative snippets that were never compiled
# (upstream builds with Bazel, no doctest step); they do not build as Rust
# doctests, so the doctest target is disabled rather than editing src/.
doctest = false

[dependencies]
# Repointed at the renamed vendored protocol fork; the `package =` alias keeps
# the in-source `use typedb_protocol::...` imports resolving unchanged.
typedb-protocol = { package = "type-bridge-typedb-protocol-b7", path = "../typedb-protocol-b7", version = "=3.7.0" }

tokio = { version = "1.28.2", features = ["rt", "rt-multi-thread"] }
tracing = "0.1.37"
serde = "1.0.207"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
tokio-stream = "0.1.11"
futures = { version = "0.3.30", features = ["executor", "thread-pool"] }
itertools = "0.10.3"
uuid = { version = "1.1.2", features = ["fast-rng", "v4"] }
prost = "^0.13"
chrono-tz = { version = "0.9.0", features = ["case-insensitive"] }
tonic-types = "^0.12"
http = "1.1.0"
tonic = { version = "^0.12", features = ["tls", "tls-roots"] }
maybe-async = "0.2.7"
chrono = "0.4.38"
crossbeam = "0.8.2"

# Upstream's generated manifest omits dev-dependencies, so the published
# crate cannot compile its own #[cfg(test)] code; restored here (rand 0.8 —
# the test code uses the pre-0.9 distributions/thread_rng API).
[dev-dependencies]
rand = "0.8"
serde_json = "1"
