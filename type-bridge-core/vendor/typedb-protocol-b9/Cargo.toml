# Historical quarantine only. This manifest must remain publish=false,
# workspace-excluded, and forbidden for every TypeBridge dependency graph.
[package]
name = "type-bridge-typedb-protocol-b9"
version = "3.12.0"
publish = false
edition = "2024"
license = "MPL-2.0"
license-file = "LICENSE"
description = "Historical quarantined TypeDB protocol 3.12.0 snapshot; workspace-excluded and forbidden for current TypeBridge consumption"
readme = "README.md"
repository = "https://github.com/ds1sqe/type-bridge"
homepage = "https://github.com/typedb/typedb-protocol"

# Vendored upstream source compiled under this workspace's toolchain trips
# style lints upstream's own build system never surfaced; allow them at the
# manifest level rather than edit vendored src/ (see vendor/README.md).
[lints.rust]
unused = "allow"
dead_code = "allow"

[lints.clippy]
all = "allow"

[lib]
path = "src/typedb.protocol.rs"
# Generated protocol code; no doctests intended (see driver fork note).
doctest = false

[dependencies]
prost = "=0.13.5"
tonic = "=0.12.3"
