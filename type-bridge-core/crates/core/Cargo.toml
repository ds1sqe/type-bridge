[package]
name = "type-bridge-core-lib"
version = "1.4.5"
edition = "2024"
description = "TypeQL AST, schema parser, query compiler, and validation engine for type-bridge"
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
pyo3 = ["dep:pyo3", "dep:pythonize"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
regex = "1"
unicode-ident = "1.0"
winnow = "0.7"
# Minimal blocking HTTP client for the server-version probe (GET /v1/version).
# ureq 2.x ships with rustls TLS built-in so https works without openssl.
ureq = "2"
pyo3 = { version = "0.23", optional = true }
pythonize = { version = "0.23", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "compilation"
harness = false

[[bench]]
name = "schema"
harness = false
