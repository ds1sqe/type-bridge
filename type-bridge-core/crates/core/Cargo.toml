[package]
name = "type-bridge-core-lib"
version = "0.1.0-dev.0"
edition = "2024"

[features]
default = []
pyo3 = ["dep:pyo3", "dep:pythonize"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
regex = "1"
unicode-ident = "1.0"
winnow = "0.7"
pyo3 = { version = "0.23", optional = true }
pythonize = { version = "0.23", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "compilation"
harness = false

[[bench]]
name = "schema"
harness = false
