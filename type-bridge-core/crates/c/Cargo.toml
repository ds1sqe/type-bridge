[package]
name = "type-bridge-c"
version = "2.3.2"
edition = "2024"
description = "Private native C ABI for generated TypeBridge packages and typed queries"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
rust-version = "1.88"

[lib]
name = "type_bridge_c"
crate-type = ["cdylib", "rlib"]

[dependencies]
type-bridge-contract = { path = "../contract", version = "2.3.2" }
type-bridge-core-lib = { path = "../core", version = "2.3.2" }
type-bridge-orm = { path = "../orm", version = "2.3.2", default-features = false, features = ["band9"] }
type-bridge-schema = { path = "../schema", version = "2.3.2" }
type-bridge-schema-codegen = { path = "../schema-codegen", version = "2.3.2" }
type-bridge-schema-migration = { path = "../schema-migration", version = "2.3.2" }
type-bridge-schema-migration-typedb = { path = "../schema-migration-typedb", version = "2.3.2" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Private perf harness; only the off-by-default `perf-stages` feature links it.
type-bridge-perf-stages = { path = "../perf-stages", default-features = false, optional = true }

[features]
default = []
# The private, non-ABI `tb_perf_stages_json` recorder for the perf drivers.
# Never enabled for shipped archives.
perf-stages = ["dep:type-bridge-perf-stages"]

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
