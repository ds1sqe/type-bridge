[package]
name = "type-bridge-workspace"
version = "2.1.0"
edition = "2024"
description = "Validated programmatic workspace configuration for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge-workspace/2.1.0"
rust-version = "1.88"

[lib]
name = "type_bridge_workspace"
path = "src/lib.rs"

[dependencies]
cap-fs-ext = "4.0"
cap-std = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
type-bridge-contract = { path = "../contract", version = "2.1.0" }
type-bridge-schema = { path = "../schema", version = "2.1.0" }
type-bridge-schema-compat = { path = "../schema-compat", version = "2.1.0" }
type-bridge-schema-migration = { path = "../schema-migration", version = "2.1.0" }

[lints]
workspace = true
