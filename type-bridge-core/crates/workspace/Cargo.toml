[package]
name = "type-bridge-workspace"
version = "0.1.0"
edition = "2024"
description = "Validated programmatic workspace configuration for type-bridge"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "type_bridge_workspace"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
type-bridge-contract = { path = "../contract", version = "0.1.0" }
type-bridge-schema = { path = "../schema", version = "0.1.0" }
type-bridge-schema-migration = { path = "../schema-migration", version = "0.1.0" }

[lints]
workspace = true
