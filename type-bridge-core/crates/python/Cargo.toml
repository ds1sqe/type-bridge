[package]
name = "type-bridge-core"
version = "0.1.0-dev.0"
edition = "2024"

[lib]
name = "type_bridge_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
type-bridge-core-lib = { path = "../core" }
pyo3 = { version = "0.23", features = ["extension-module"] }
pythonize = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
