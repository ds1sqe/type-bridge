[package]
name = "type-bridge-core"
version = "1.5.11"
edition = "2024"
description = "PyO3 bindings exposing the type-bridge Rust core to Python"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "type_bridge_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
type-bridge-core-lib = { path = "../core", version = "1.5.11" }
type-bridge-migration = { path = "../migration", version = "1.5.11" }
type-bridge-orm = { path = "../orm", version = "1.5.11" }
type-bridge-toml-transpiler = { path = "../toml-transpiler", version = "1.5.11" }
# Keep ordinary Rust test binaries linked to libpython. Maturin enables
# `pyo3/extension-module` only for extension builds (see ../../pyproject.toml).
pyo3 = { version = "0.23", features = ["abi3-py312"] }
pythonize = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
