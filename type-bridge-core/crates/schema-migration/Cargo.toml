[package]
name = "type-bridge-schema-migration"
version = "2.0.2"
edition = "2024"
description = "Canonical schema migration planning for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]

[dependencies]
cap-fs-ext = "4.0"
cap-std = "4.0"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
type-bridge-contract = { path = "../contract", version = "2.0.2" }
type-bridge-query = { path = "../query", version = "2.0.2" }
type-bridge-schema = { path = "../schema", version = "2.0.2" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
