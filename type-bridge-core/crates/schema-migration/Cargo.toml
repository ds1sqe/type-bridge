[package]
name = "type-bridge-schema-migration"
version = "2.2.6"
edition = "2024"
description = "Canonical schema migration planning for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge-schema-migration/2.2.6"
rust-version = "1.88"

[dependencies]
cap-fs-ext = "4.0"
cap-std = "4.0"
fs2 = "0.4"
futures-timer = "3"
futures-util = { version = "0.3", default-features = false, features = ["async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
type-bridge-contract = { path = "../contract", version = "2.2.6" }
type-bridge-core-lib = { path = "../core", version = "2.2.6" }
type-bridge-query = { path = "../query", version = "2.2.6" }
type-bridge-schema = { path = "../schema", version = "2.2.6" }

[lints]
workspace = true

[dev-dependencies]
futures-executor = "0.3"
tempfile = "3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
type-bridge-orm = { path = "../orm" }
type-bridge-schema-compat = { path = "../schema-compat" }
