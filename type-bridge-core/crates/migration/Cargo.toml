[package]
name = "type-bridge-migration"
version = "2.3.2"
edition = "2024"
description = "Migration IR and planning substrate for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge-migration/2.3.2"
rust-version = "1.88"

[lib]
name = "type_bridge_migration"
path = "src/lib.rs"

[dependencies]
type-bridge-schema = { path = "../schema", version = "2.3.2" }
type-bridge-schema-compat = { path = "../schema-compat", version = "2.3.2" }
type-bridge-contract = { path = "../contract", version = "2.3.2" }
type-bridge-core-lib = { path = "../core", version = "2.3.2" }
type-bridge-orm = { path = "../orm", version = "2.3.2", default-features = false, features = ["band9"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
network-interface = "2.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
