[package]
name = "type-bridge-contract"
version = "2.3.3"
edition = "2024"
description = "Versioned binding-neutral contract primitives for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge-contract/2.3.3"
rust-version = "1.88"

[lib]
name = "type_bridge_contract"
path = "src/lib.rs"

[features]
default = []
serde-backend-conformance = ["serde_json/arbitrary_precision", "serde_json/preserve_order"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
# Stage spans only; without the default proc-macro feature.
tracing = { version = "0.1", default-features = false, features = ["std"] }
unicode-ident = "1.0"

[lints]
workspace = true

[dev-dependencies]
ed25519-dalek = "2"
