[package]
name = "type-bridge-schema-compat"
version = "2.0.2"
edition = "2024"
description = "Released-schema compatibility front-end for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
type-bridge-contract = { path = "../contract", version = "2.0.2" }
type-bridge-core-lib = { path = "../core", version = "2.0.2" }
type-bridge-schema = { path = "../schema", version = "2.0.2" }
type-bridge-toml-transpiler = { path = "../toml-transpiler", version = "2.0.2" }
typeql = "=3.12.0"


[lints]
workspace = true
