[package]
name = "type-bridge-schema-compat"
version = "3.0.0"
edition = "2024"
description = "Released-schema compatibility front-end for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge-schema-compat/3.0.0"
rust-version = "1.88"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
type-bridge-contract = { path = "../contract", version = "3.0.0" }
type-bridge-core-lib = { path = "../core", version = "3.0.0" }
type-bridge-schema = { path = "../schema", version = "3.0.0" }
typeql.workspace = true


[lints]
workspace = true
