format: typebridge.schema/v2
attributes:
  person-id: { value: string }
  team-id: { value: string }
  count: { value: integer }
entities:
  person:
    owns:
      person-id: { key: true }
relations:
  team:
    owns:
      team-id: { key: true }
      count: { card: { min: 0, max: 1 } }
    relates:
      member: { card: { min: 0, max: 3 }, ordered: true }
plays:
  person:
    team: { member: {} }
