[package]
name = "type-bridge-orm-derive"
version = "2.1.0"
edition = "2024"
description = "Generated-query derives for the TypeBridge Rust client"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge-orm-derive/2.1.0"
rust-version = "1.88"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
type-bridge-core-lib = { path = "../core", version = "2.1.0" }

[lints]
workspace = true
