[package]
name = "type-bridge-node"
version = "1.5.7"
edition = "2024"
description = "NAPI bindings exposing the type-bridge Rust ORM runtime to Node.js"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "type_bridge_node"
crate-type = ["cdylib", "rlib"]

[dependencies]
type-bridge-core-lib = { path = "../core", version = "1.5.7" }
type-bridge-orm = { path = "../orm", version = "1.5.7", default-features = false, features = ["band7", "band8", "band9"] }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
