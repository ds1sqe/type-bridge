[package]
name = "type-bridge-node"
version = "2.3.0"
edition = "2024"
description = "TypeScript and Node SDK bindings for the TypeBridge shared Rust semantic engine"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "type_bridge_node"
crate-type = ["cdylib", "rlib"]

[features]
default = []
contract-test-adapter = []
# The private `_perfStages()` recorder for the perf drivers. Never enabled
# for shipped packages.
perf-stages = ["dep:type-bridge-perf-stages"]

[dependencies]
type-bridge-contract = { path = "../contract", version = "2.3.0" }
type-bridge-core-lib = { path = "../core", version = "2.3.0" }
type-bridge-orm = { path = "../orm", version = "2.3.0", default-features = false, features = ["band8", "band9"] }
type-bridge-schema = { path = "../schema", version = "2.3.0" }
type-bridge-schema-codegen = { path = "../schema-codegen", version = "2.3.0" }
type-bridge-schema-migration = { path = "../schema-migration", version = "2.3.0" }
type-bridge-schema-migration-typedb = { path = "../schema-migration-typedb", version = "2.3.0" }
napi = { version = "=3.12.1", default-features = false, features = ["napi8", "compat-mode"] }
napi-derive = { version = "=3.6.3", features = ["compat-mode"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Private perf harness; only the off-by-default `perf-stages` feature links it.
type-bridge-perf-stages = { path = "../perf-stages", default-features = false, optional = true }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
napi = { version = "=3.12.1", default-features = false, features = ["dyn-symbols"] }
sha2 = "0.10"

[lints]
workspace = true
