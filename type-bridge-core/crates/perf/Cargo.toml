[package]
name = "type-bridge-perf"
version = "2.3.1"
edition = "2024"
rust-version = "1.88"
description = "Private perf harness: stage-span timing and the live Rust pipelines"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
# Measures the public crates; never published and never a dependency of
# a shipped crate.
publish = false

[lib]
name = "type_bridge_perf"
path = "src/lib.rs"

[[bin]]
name = "type-bridge-perf-pipelines"
path = "src/bin/pipelines.rs"
required-features = ["pipelines"]

[features]
default = ["pipelines"]
# The Rust pipeline driver. The SDK bindings link only
# type-bridge-perf-stages, so they never pull the SDK or the CLI.
pipelines = [
    "dep:serde_json",
    "dep:tokio",
    "dep:type-bridge",
    "dep:type-bridge-cli",
    "dep:type-bridge-orm",
    "dep:type-bridge-contract",
    "dep:type-bridge-schema",
    "dep:type-bridge-schema-codegen",
]

[dependencies]
type-bridge-perf-stages = { path = "../perf-stages" }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
type-bridge = { path = "../rust", optional = true }
type-bridge-cli = { path = "../cli", optional = true }
type-bridge-orm = { path = "../orm", optional = true }
# The shared purchase models (`crates/rust/tests/support`) compile their
# package from Split-YAML with these.
type-bridge-contract = { path = "../contract", optional = true }
type-bridge-schema = { path = "../schema", optional = true }
type-bridge-schema-codegen = { path = "../schema-codegen", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }

[lints]
workspace = true
