[package]
name = "type-bridge-typedb-runtime"
version = "2.0.2"
edition = "2024"
description = "Shared TypeDB runtime driver layer for type-bridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]

[lib]
name = "type_bridge_typedb_runtime"
path = "src/lib.rs"

[features]
default = ["band7", "band8", "band9"]
band7 = ["dep:type-bridge-typedb-driver-b7", "dep:chrono"]
band8 = ["dep:type-bridge-typedb-driver-b8", "dep:chrono"]
band9 = ["dep:typedb-driver", "dep:chrono", "dep:chrono-tz"]

[dependencies]
type-bridge-core-lib = { path = "../core", version = "2.0.2" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
type-bridge-typedb-driver-b7 = { path = "../../vendor/typedb-driver-b7", version = "=3.8.1", optional = true }
type-bridge-typedb-driver-b8 = { path = "../../vendor/typedb-driver-b8", version = "=3.11.5", optional = true }
typedb-driver = { version = "=3.12.1", optional = true }
# Driver-band temporal bridging: parse GivenValue on band 9 and preserve exact
# datetime-tz evidence across every supported driver band.
chrono = { version = "0.4", optional = true }
chrono-tz = { version = "=0.9.0", features = ["case-insensitive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
