[package]
name = "type-bridge"
version = "2.2.0"
edition = "2024"
rust-version = "1.88"
description = "Public client SDK for TypeBridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge/2.2.0"

[lib]
name = "type_bridge"
path = "src/lib.rs"

[features]
default = ["typedb", "band8", "band9"]
typedb = ["type-bridge-orm/typedb", "dep:type-bridge-schema-migration-typedb"]
band8 = ["typedb", "type-bridge-orm/band8"]
band9 = ["typedb", "type-bridge-orm/band9"]
test-harness = []

[dependencies]
type-bridge-contract = { path = "../contract", version = "2.2.0" }
type-bridge-orm = { path = "../orm", version = "2.2.0", default-features = false }
type-bridge-orm-derive = { path = "../orm-derive", version = "2.2.0" }
type-bridge-schema = { path = "../schema", version = "2.2.0" }
type-bridge-schema-codegen = { path = "../schema-codegen", version = "2.2.0" }
type-bridge-schema-migration = { path = "../schema-migration", version = "2.2.0" }
type-bridge-schema-migration-typedb = { path = "../schema-migration-typedb", version = "2.2.0", optional = true }
thiserror = "2"
tracing = "0.1"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
type-bridge-contract = { path = "../contract", version = "2.2.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
