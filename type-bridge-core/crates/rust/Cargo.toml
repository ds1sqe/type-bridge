[package]
name = "type-bridge"
version = "2.0.1"
edition = "2024"
rust-version = "1.88"
description = "Public client SDK for TypeBridge"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]

[lib]
name = "type_bridge"
path = "src/lib.rs"

[features]
default = ["typedb", "band7", "band8", "band9"]
typedb = ["type-bridge-orm/typedb"]
band7 = ["typedb", "type-bridge-orm/band7"]
band8 = ["typedb", "type-bridge-orm/band8"]
band9 = ["typedb", "type-bridge-orm/band9"]
test-harness = []

[dependencies]
type-bridge-contract = { path = "../contract", version = "2.0.1" }
type-bridge-orm = { path = "../orm", version = "2.0.1", default-features = false }
type-bridge-orm-derive = { path = "../orm-derive", version = "2.0.1" }
thiserror = "2"
regex = "1"
serde_json = "1"

[dev-dependencies]
type-bridge-contract = { path = "../contract", version = "2.0.1" }
type-bridge-schema = { path = "../schema", version = "2.0.1" }
type-bridge-schema-codegen = { path = "../schema-codegen", version = "2.0.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[lints]
workspace = true
