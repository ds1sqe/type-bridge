[package]
name = "type-bridge-orm"
version = "1.4.3"
edition = "2024"
description = "Async ORM for TypeDB built on type-bridge-core-lib"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "type_bridge_orm"
path = "src/lib.rs"

[[bin]]
name = "type-bridge-codegen"
path = "src/bin/codegen.rs"

[features]
default = ["typedb"]
typedb = ["dep:typedb-driver", "dep:futures"]
derive = ["dep:type-bridge-orm-derive"]

[dependencies]
type-bridge-core-lib = { path = "../core", version = "1.4.3" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
type-bridge-orm-derive = { path = "../orm-derive", version = "1.4.3", optional = true }

# Optional: real TypeDB backend
typedb-driver = { version = "3", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "serde"
harness = false

[[bench]]
name = "query_building"
harness = false

[lints]
workspace = true
