[package]
name = "type-bridge-orm"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async ORM for TypeDB built on type-bridge-core-lib"
license.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/type-bridge-orm/2.1.0"

[lib]
name = "type_bridge_orm"
path = "src/lib.rs"

[features]
default = ["band8", "band9"]
typedb = ["dep:type-bridge-typedb-runtime"]
band8 = ["typedb", "type-bridge-typedb-runtime/band8"]
band9 = ["typedb", "type-bridge-typedb-runtime/band9"]
integration-tests = ["band8", "band9"]

[dependencies]
type-bridge-contract = { path = "../contract", version = "2.1.0" }
type-bridge-query = { path = "../query", version = "2.1.0" }
type-bridge-schema = { path = "../schema", version = "2.1.0" }
type-bridge-schema-compat = { path = "../schema-compat", version = "2.1.0" }
type-bridge-core-lib = { path = "../core", version = "2.1.0" }
type-bridge-typedb-runtime = { path = "../typedb-runtime", version = "2.1.0", default-features = false, optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
unicase = "2.9"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
typeql = "=3.12.0"

[[bench]]
name = "serde"
harness = false

[[bench]]
name = "query_building"
harness = false

[lints]
workspace = true
