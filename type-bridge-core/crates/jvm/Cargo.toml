[package]
name = "type-bridge-jvm"
version = "2.2.2"
edition = "2024"
description = "Private JNI boundary for generated TypeBridge Kotlin/JVM packages"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
rust-version = "1.88"

[lib]
name = "type_bridge_jvm"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.22.4"
type-bridge-contract = { path = "../contract", version = "2.2.2" }
type-bridge-schema = { path = "../schema", version = "2.2.2" }
type-bridge-schema-codegen = { path = "../schema-codegen", version = "2.2.2" }

type-bridge-orm = { path = "../orm", version = "2.2.2" }

[lints]
workspace = true

[dev-dependencies]
jni = { version = "=0.22.4", features = ["invocation"] }
serde_json = "1"
sha2 = "0.10"
