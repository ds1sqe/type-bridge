format: typebridge.workspace/v1
schema:
  root: schema.yaml
  ownership: exclusive
  managed-scope: walkthrough
compatibility:
  semantic-profile: typedb-3.13.6/v1
migrations:
  directory: migrations
  app-label: walkthrough
bindings:
  python:
    output: generated/python
  typescript:
    output: generated/typescript
  rust:
    output: generated/rust
  c:
    output: generated/c
